<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11110F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cultura">
<title>Cultura Growth · Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* Cultura Growth — fundação */
  --ink:#11110F;
  --paper:#F2EFE7;
  --paper-bright:#F8F5ED;
  --soft:#C7C4BB;
  --white:#FFFDF8;
  --lime:#C4F23B;      /* BR / Signal Lime */
  --mute:#8A877C;
  --line:rgba(17,17,15,.10);
  --line-dark:rgba(242,239,231,.12);

  /* tema do projeto (trocado em runtime) */
  --p-dark:#11110F; --p-light:#F2EFE7; --p-accent:#C4F23B;
  --p-soft:#C7C4BB; --p-deep:#3F3E35; --p-disp:'Cormorant Garamond';

  /* status */
  --st-rascunho:#8A877C;
  --st-producao:#4E7C91;
  --st-aguardando:#D9A62E;
  --st-cliente:#8E6FB0;
  --st-aprovado:#C4F23B;
  --st-publicado:#6E8F3E;
  --st-ajustar:#E8833A;
  --st-cancelado:#D6453C;

  --nav:74px;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-weight:400;line-height:1.5;overscroll-behavior:none;touch-action:manipulation;
  font-size:15px;
}
body.inproj{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
body.dragging{overflow:hidden;touch-action:none}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
input,textarea,select{font-family:inherit;color:var(--ink);font-size:15px}
.serif{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400}

/* ============================================================
   SPLASH
   ============================================================ */
html{background:#F2EFE7}
html,body{overflow-x:clip;overscroll-behavior:none}
html:has(body.booting){background:#11110F}
#splash{
  position:fixed;inset:0;z-index:200;background:#11110F;
  display:grid;place-items:center;
  transition:opacity .55s ease, visibility .55s;
}
#splash.out{opacity:0;visibility:hidden}
/* a Home é montada por baixo, mas fica invisível enquanto a intro roda */
body.booting{background:#11110F}
body.booting #app{visibility:hidden;opacity:0}
#app{opacity:1;transition:opacity .45s ease .05s}
.sp-in{text-align:center;padding:0 24px}
.sp-mark{
  font-weight:900;font-size:clamp(38px,12vw,62px);letter-spacing:-.02em;
  color:var(--paper);line-height:1;position:relative;display:inline-block;
  filter:blur(16px);opacity:0;transform:scale(1.07);
  animation:markIn 1.15s cubic-bezier(.2,.7,.2,1) .25s forwards;
}
.sp-mark sup{font-size:.28em;font-weight:600;vertical-align:super;margin-left:.06em}
@keyframes markIn{to{filter:blur(0);opacity:1;transform:scale(1)}}
.sp-rule{
  height:2px;background:var(--lime);margin:20px auto 0;width:0;
  animation:ruleIn .75s cubic-bezier(.4,0,.1,1) 1.2s forwards;
}
@keyframes ruleIn{to{width:140px}}
.sp-sub{
  margin-top:16px;font-size:10px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--mute);opacity:0;
  animation:fadeIn .6s ease 1.65s forwards;
}
@keyframes fadeIn{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .sp-mark,.sp-rule,.sp-sub{animation:none!important;filter:none;opacity:1;transform:none;width:140px}
}

/* ============================================================
   HOME (Cultura Growth)
   ============================================================ */
.home{background:var(--ink);color:var(--paper);min-height:100vh;padding-bottom:70px}
.home-top{padding:calc(env(safe-area-inset-top) + 40px) 0 0}
.h-mark{display:flex;align-items:center;justify-content:space-between;gap:16px}
.h-mark .wm{font-weight:900;font-size:25px;letter-spacing:-.015em;line-height:1;color:var(--paper)}
.h-mark .wm sup{font-size:.3em;font-weight:600;vertical-align:super}
.h-mark .lbl{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);text-align:right;line-height:1.5}
.h-lede{margin-top:38px;max-width:20ch}
.h-lede h1{font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.04;letter-spacing:-.02em}
.h-lede h1 em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;display:block;letter-spacing:0}
.h-rule{height:1px;background:var(--line-dark);margin:34px 0 0}

.h-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-dark);margin-top:1px}
.h-stat{background:var(--ink);padding:18px 4px 20px}
.h-stat b{display:block;font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em}
.h-stat b.hot{color:var(--lime)}
.h-stat span{display:block;font-size:8.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:8px}

.sect{display:flex;align-items:center;justify-content:space-between;margin:40px 0 14px}
.sect h2{font-size:9px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.sect span{font-size:11px;color:var(--mute)}

.pcards{display:grid;gap:10px}
.pcard{
  display:block;width:100%;text-align:left;position:relative;
  background:rgba(242,239,231,.035);border:1px solid var(--line-dark);
  border-radius:var(--r);overflow:hidden;transition:background .18s,border-color .18s,transform .12s;
}
.pcard:hover{background:rgba(242,239,231,.07);border-color:rgba(242,239,231,.22)}
.pcard:active{transform:scale(.993)}
.pc-band{height:3px;display:flex}
.pc-band i{flex:1;display:block}
.pc-in{padding:18px 18px 19px;display:flex;align-items:flex-start;gap:15px}
.pc-mark{flex:0 0 44px;height:44px;border-radius:var(--r);display:grid;place-items:center}
.pc-mark svg{width:23px;height:23px}
.pc-main{flex:1;min-width:0}
.pc-main h3{font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.2}
.pc-main small{display:block;font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.pc-meta{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.pc-meta div b{display:block;font-weight:700;font-size:16px;line-height:1}
.pc-meta div.hot b{color:var(--lime)}
.pc-meta div span{display:block;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.pc-chev{flex:0 0 15px;color:var(--mute);padding-top:14px}

.newp{
  width:100%;border:1px dashed rgba(242,239,231,.2);border-radius:var(--r);
  padding:19px;color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;transition:.18s;
}
.newp:hover{border-color:var(--lime);color:var(--lime)}
.h-foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line-dark);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.h-foot span{font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
#syncbar{font-size:10.5px;color:var(--mute);letter-spacing:.04em}

.whoami{margin-top:26px;border:1px solid var(--line-dark);border-radius:var(--r);padding:16px}
.whoami p{font-size:12px;color:var(--mute);margin-bottom:12px}
.whoami .row{display:flex;gap:8px}
.whoami button{
  flex:1;padding:12px;border:1px solid rgba(242,239,231,.24);border-radius:var(--r);
  color:var(--paper);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:.16s;
}
.whoami button:hover{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.who-tag{font-size:12px;color:var(--mute);margin-top:22px}
.who-tag b{color:var(--lime);font-weight:600}
.who-tag button{font-size:11px;color:var(--mute);text-decoration:underline;margin-left:8px}

/* ============================================================
   TOPO DO PROJETO
   ============================================================ */
header{
  background:var(--p-dark);color:var(--p-light);
  padding:calc(env(safe-area-inset-top) + 12px) 0 0;
  position:sticky;top:0;z-index:40;
}
.hbar{display:flex;align-items:center;gap:12px;padding-bottom:14px}
.ic-btn{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;opacity:.65;flex:0 0 34px;transition:.15s}
.ic-btn:hover{opacity:1;background:rgba(255,255,255,.1)}
.htitle{flex:1;min-width:0}
.htitle h1{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.htitle small{display:block;font-size:8px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.5;margin-top:5px}
.mnav{display:flex;align-items:center;justify-content:center;gap:14px;padding-bottom:13px}
.mnav .ic-btn{width:30px;height:30px;flex:0 0 30px}
.mnav b{font-weight:700;font-size:16px;letter-spacing:.01em;min-width:168px;text-align:center;text-transform:uppercase}
.mnav b i{font-style:normal;opacity:.45;font-weight:400}
.track{display:flex;height:3px;background:rgba(255,255,255,.12)}
.track span{display:block;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ============================================================
   NAV INFERIOR
   ============================================================ */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:color-mix(in srgb,var(--p-light) 93%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:flex;
}
nav.tabs button{flex:1;padding:12px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--p-deep);opacity:.45;transition:.16s}
nav.tabs button[aria-selected="true"]{opacity:1;color:var(--p-dark)}
nav.tabs svg{width:19px;height:19px}
nav.tabs span{font-size:9px;font-weight:600;letter-spacing:.11em;text-transform:uppercase}

/* ============================================================
   CALENDÁRIO
   ============================================================ */
.cal{padding:16px 0 10px}
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;overscroll-behavior-x:contain}
.viewsw{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.viewsw button{padding:7px 13px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p-deep);opacity:.6;transition:.15s}
.viewsw button[aria-pressed="true"]{background:var(--p-dark);color:var(--p-light);opacity:1}
.fbtn{
  margin-left:auto;display:flex;align-items:center;gap:7px;padding:7px 13px;
  border:1px solid var(--line);border-radius:var(--r);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--p-deep);transition:.15s;
}
.fbtn.on{background:var(--p-dark);color:var(--p-light);border-color:var(--p-dark)}
.fbtn i{width:6px;height:6px;border-radius:99px;background:var(--st-ajustar);display:block}

.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:6px}
.dow span{text-align:center;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--p-deep);opacity:.5}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}

.cell{
  min-height:88px;border-radius:var(--r);padding:4px 2px 4px;
  display:flex;flex-direction:column;align-items:stretch;gap:3px;
  background:transparent;border:1px solid transparent;transition:background .15s,border-color .15s;
  position:relative;
}
.cell.pad{opacity:.25;pointer-events:none}
.cell .dnum{
  font-size:10.5px;font-weight:600;color:var(--p-deep);opacity:.65;
  text-align:center;flex:0 0 auto;line-height:1.3;
}
.cell.today .dnum{
  color:var(--p-light);background:var(--p-dark);border-radius:99px;
  width:19px;height:19px;display:grid;place-items:center;margin:0 auto;opacity:1;font-size:10px;
}
.cell.drop-on{background:color-mix(in srgb,var(--p-accent) 16%,transparent);border-color:var(--p-accent)}
.cell.livre{cursor:pointer}

.chip{
  border-radius:2px;padding:3px 4px 4px;text-align:left;width:100%;
  background:var(--white);border:1px solid var(--line);
  border-left:2.5px solid var(--st-rascunho);
  line-height:1.2;color:var(--ink);
  overflow:hidden;transition:transform .12s,box-shadow .15s;
  touch-action:none;
}
.chip:active{transform:scale(.96)}
.chip .fmt{
  display:flex;align-items:center;gap:2px;font-weight:700;font-size:6.5px;
  letter-spacing:.07em;text-transform:uppercase;opacity:.62;
  white-space:nowrap;overflow:hidden;
}
.chip .fmt svg{width:7px;height:7px;flex:0 0 7px}
.chip .fmt .fnm{overflow:hidden;text-overflow:ellipsis}
.chip .tt{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:1px;font-weight:600;font-size:9.5px;line-height:1.18;letter-spacing:-.01em;
  overflow-wrap:anywhere;
}
.chip .chrow{display:block}
.chip .tsk{font-size:7px;font-weight:600;opacity:.55;display:block;margin-top:2px}
.chip .lt{
  display:block;margin-top:2px;font-size:6.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--st-cancelado);
}
.chip.late{background:color-mix(in srgb,var(--st-cancelado) 6%,var(--white))}
.chip.evento{background:var(--p-dark);color:var(--p-light);border-left-color:var(--p-accent);border-color:var(--p-dark)}
.chip.evento .fmt{opacity:.8}
.chip.ghost{opacity:.3}
.chip.mais{background:transparent;border:0;border-left:0;text-align:center;font-size:7.5px;font-weight:600;color:var(--p-deep);opacity:.6;padding:1px}

#dragghost{
  position:fixed;z-index:120;pointer-events:none;width:110px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);transform:rotate(-1.5deg) scale(1.04);
  opacity:.95;
}
.cal-note{font-size:10.5px;color:var(--p-deep);opacity:.55;text-align:center;margin-top:16px;line-height:1.6}

/* semana */
.week{display:flex;flex-direction:column;gap:2px;padding:4px 0 10px}
.wrow{display:grid;grid-template-columns:52px 1fr;gap:10px;border-top:1px solid var(--line);padding:11px 0 12px;min-height:62px}
.wrow.hoje{background:color-mix(in srgb,var(--p-accent) 7%,transparent)}
.wd{text-align:center}
.wd b{display:block;font-weight:700;font-size:20px;line-height:1;letter-spacing:-.02em}
.wd span{display:block;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--p-deep);opacity:.6;margin-top:4px}
.witems{display:flex;flex-direction:column;gap:5px;justify-content:center}
.wchip{
  display:flex;align-items:flex-start;gap:9px;background:var(--white);
  border:1px solid var(--line);border-left:3px solid var(--st-rascunho);
  border-radius:2px;padding:9px 11px;text-align:left;width:100%;touch-action:none;
}
.wchip:active{transform:scale(.995)}
.wchip .wc-main{flex:1;min-width:0}
.wchip h4{font-weight:600;font-size:13.5px;line-height:1.25}
.wchip .wc-meta{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.wchip.evento{background:var(--p-dark);color:var(--p-light);border-color:var(--p-dark)}
.wchip.late{background:color-mix(in srgb,var(--st-cancelado) 5%,var(--white))}
.card.late{background:color-mix(in srgb,var(--st-cancelado) 4%,var(--white))}
.wempty{font-size:11px;color:var(--p-deep);opacity:.4;align-self:center}

/* ============================================================
   BADGES
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;padding:3px 7px;border-radius:99px;
}
.badge i{width:5px;height:5px;border-radius:99px;display:block;flex:0 0 5px}
.fbadge{
  display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--p-deep);opacity:.75;
}
.fbadge svg{width:9px;height:9px}

/* ============================================================
   LISTA
   ============================================================ */
.filters{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{
  flex:0 0 auto;border:1px solid var(--line);color:var(--p-deep);font-size:10px;
  font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:7px 12px;border-radius:99px;transition:.15s;
}
.fchip[aria-pressed="true"]{background:var(--p-dark);border-color:var(--p-dark);color:var(--p-light)}
.wk{font-size:8.5px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--p-deep);opacity:.45;margin:22px 0 9px}
.card{
  background:var(--white);border:1px solid var(--line);border-left:3px solid var(--st-rascunho);
  border-radius:var(--r);display:flex;align-items:flex-start;gap:14px;width:100%;
  padding:15px 16px;margin-bottom:7px;text-align:left;transition:.15s;
}
.card:active{transform:scale(.995)}
.dt{flex:0 0 38px;text-align:center}
.dt b{display:block;font-weight:700;font-size:21px;line-height:1;letter-spacing:-.02em;color:var(--p-dark)}
.dt span{display:block;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--p-deep);opacity:.6;margin-top:3px}
.cmain{flex:1;min-width:0}
.cmain h3{font-weight:600;font-size:15.5px;line-height:1.25;letter-spacing:-.005em}
.cmain .row2{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.msg{padding:44px 20px;text-align:center;color:var(--p-deep);font-size:13.5px;opacity:.7;line-height:1.7}

/* ---- modo noturno: cards da aba Posts ----
   No escuro a superfície branca some e o número, que é escuro,
   some junto. Aqui a superfície escurece e o texto vira claro. */
@media (prefers-color-scheme: dark){
  .card{
    background:color-mix(in srgb, var(--p-dark) 82%, #000);
    border-color:rgba(255,255,255,.12);
  }
  .card .dt b{color:#FFFDF8}
  .card .dt span{color:#FFFDF8;opacity:.72}
  .card .cmain h3{color:#FFFDF8}
  .card .fbadge{color:#FFFDF8;opacity:.78}
  .card .badge{color:#FFFDF8 !important}
  .card .badge i{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  .card.late{background:color-mix(in srgb, var(--st-cancelado) 20%, #15140F)}
  .wk{color:#FFFDF8;opacity:.55}
  .fchip{color:#FFFDF8;border-color:rgba(255,255,255,.2)}
  .fchip[aria-pressed="true"]{background:#FFFDF8;color:var(--p-dark);border-color:#FFFDF8}
}

/* ============================================================
   SHEET / DRAWER
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(17,17,15,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;top:0;z-index:61;background:var(--p-light);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-width:900px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
@media(min-width:780px){
  .sheet{top:auto;bottom:0;max-height:88vh;border-radius:6px 6px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.2)}
}
.sh-top{
  flex:0 0 auto;background:var(--p-dark);color:var(--p-light);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 15px;
  display:flex;align-items:flex-start;gap:12px;
}
@media(min-width:780px){.sh-top{padding-top:16px}}
.sh-top .sh-main{flex:1;min-width:0}
.sh-top h2{font-weight:700;font-size:19px;line-height:1.22;letter-spacing:-.015em}
.sh-top .sh-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.sh-close{flex:0 0 40px;width:40px;height:40px;border-radius:99px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.sh-close:active{background:rgba(255,255,255,.25)}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom) + 34px)}
.sh-foot{
  flex:0 0 auto;border-top:1px solid var(--line);background:var(--p-light);
  padding:10px 18px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;
}
.sh-foot .pri{flex:1;background:var(--p-dark);color:var(--p-light);border-radius:var(--r);padding:14px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.sh-foot .sec{flex:0 0 auto;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p-deep)}

.sec{padding-top:20px}
.sec + .sec{margin-top:20px;border-top:1px solid var(--line)}
h4.lbl{
  font-size:8.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--p-deep);opacity:.7;margin-bottom:9px;display:flex;align-items:center;gap:8px;
}
h4.lbl span.ct{
  margin-left:auto;font-size:8px;font-weight:700;letter-spacing:.1em;
  background:var(--p-soft);color:var(--p-deep);padding:2px 7px;border-radius:99px;opacity:.9;
}
.sec p{font-size:14px;line-height:1.62}
.box{background:var(--white);border:1px solid var(--line);border-radius:2px;padding:12px 13px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.tg{font-size:12px;color:var(--p-deep);line-height:1.7;word-break:break-word}
.empty{font-size:13px;color:var(--p-deep);opacity:.5}
.flag{
  display:inline-block;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--st-ajustar);border:1px dashed color-mix(in srgb,var(--st-ajustar) 45%,transparent);
  padding:5px 10px;border-radius:2px;margin-top:10px;
}

/* status picker */
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.stbtn{
  display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--white);font-size:11px;font-weight:600;
  letter-spacing:.04em;text-align:left;transition:.15s;color:var(--ink);
}
.stbtn i{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
.stbtn[aria-pressed="true"]{border-color:var(--p-dark);border-width:1.5px;background:var(--p-light)}
.stbtn:active{transform:scale(.98)}

/* tarefas */
.tasks{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.task:last-of-type{border-bottom:0}
.tbox{
  flex:0 0 18px;width:18px;height:18px;border:1.5px solid var(--p-deep);border-radius:3px;
  display:grid;place-items:center;margin-top:1px;transition:.15s;background:var(--white);
}
.tbox svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:.15s}
.task.done .tbox{background:var(--p-dark);border-color:var(--p-dark)}
.task.done .tbox svg{opacity:1;transform:scale(1);color:var(--p-light)}
.task .ttxt{flex:1;font-size:13.5px;line-height:1.45;padding-top:1px}
.task.done .ttxt{text-decoration:line-through;opacity:.42}
.task .tdel{flex:0 0 22px;opacity:.3;transition:.15s}
.task .tdel:hover{opacity:.8;color:var(--st-cancelado)}
.addtask{display:flex;gap:7px;margin-top:10px}
.addtask input{flex:1;border:1px solid var(--line);border-radius:var(--r);background:var(--white);padding:11px 12px;font-size:14px}
.addtask button{flex:0 0 auto;padding:0 16px;border:1px solid var(--p-dark);border-radius:var(--r);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tprog{height:3px;background:var(--p-soft);border-radius:99px;overflow:hidden;margin-top:12px}
.tprog i{display:block;height:100%;background:var(--st-aprovado);border-radius:99px;transition:width .35s}

/* botões */
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.act{
  flex:1;min-width:128px;border:1px solid var(--p-dark);color:var(--p-dark);
  font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  padding:12px 10px;border-radius:var(--r);transition:.15s;background:var(--white);
}
.act:hover{background:var(--p-dark);color:var(--p-light)}
.act.solid{background:var(--p-dark);color:var(--p-light)}
.act.ghost{border-color:var(--line);color:var(--p-deep);font-weight:600;background:transparent}
.act.ghost:hover{background:var(--p-deep);color:var(--p-light);border-color:var(--p-deep)}
.act.danger{border-color:var(--st-cancelado);color:var(--st-cancelado);background:transparent}
.act.danger:hover{background:var(--st-cancelado);color:var(--white)}
.act:disabled{opacity:.4;cursor:default}
.link-btn{font-size:11px;color:var(--p-deep);opacity:.65;text-decoration:underline}
textarea,input.txt,select.txt{
  width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--white);
  padding:11px 12px;font-size:14px;line-height:1.55;margin-top:8px;
}
textarea{resize:vertical;min-height:72px}
.flbl{display:block;font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--p-deep);opacity:.7;margin-top:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* log */
.log{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.logit{background:var(--white);border-left:2px solid var(--p-accent);border-radius:2px;padding:10px 12px;font-size:13px;line-height:1.55}
.logit b{display:block;font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--p-deep);opacity:.7;margin-bottom:4px}
.stamp{font-size:10px;color:var(--p-deep);opacity:.55;margin-top:9px}

/* mídia */
.player{position:relative;width:100%;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:9/16;max-height:400px}
.player iframe,.player video,.player img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.drop{border:1px dashed color-mix(in srgb,var(--p-dark) 24%,transparent);border-radius:var(--r);padding:16px 14px;text-align:center;background:var(--white)}
.drop p{font-size:12.5px;color:var(--p-deep);line-height:1.55}
.mbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:11px;color:var(--p-deep)}
.mbar a{color:var(--p-accent);text-decoration:none;font-weight:600}
.pending{font-size:12.5px;color:var(--p-deep);opacity:.85;margin-top:11px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:99px;background:var(--p-accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.err{font-size:12.5px;color:var(--st-cancelado);margin-top:9px;line-height:1.5}

/* métricas */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px;margin-top:8px}
.mgrid label span{display:block;font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--p-deep);opacity:.7;margin-bottom:4px}
.mgrid input{width:100%;border:1px solid var(--line);border-radius:2px;background:var(--white);padding:9px 5px;font-size:15px;text-align:center;font-weight:500}
.dash{padding:18px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.kpi{background:var(--p-light);padding:16px 14px}
.kpi b{display:block;font-weight:700;font-size:25px;line-height:1;letter-spacing:-.02em;color:var(--p-dark)}
.kpi span{display:block;font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--p-deep);opacity:.72;margin-top:7px}
.kpi em{font-style:normal;font-size:10px;font-weight:600;display:block;margin-top:5px}
.kpi em.up{color:var(--st-publicado)} .kpi em.down{color:var(--st-ajustar)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:17px 16px;margin-top:12px}
.panel h3{font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--p-dark)}
.panel p.lead{font-size:12px;color:var(--p-deep);line-height:1.55;margin-top:5px}
.bars{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}
.bar-row .nm{font-size:12px;line-height:1.35;min-width:0}
.bar-row .nm small{display:block;font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p-deep);opacity:.55;margin-top:2px}
.bar-track{grid-column:1/-1;height:5px;background:var(--p-soft);border-radius:99px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--p-deep);border-radius:99px;transition:width .5s}
.bar-track i.hi{background:var(--p-accent)}
.bar-row .vl{font-weight:700;font-size:15px;color:var(--p-dark)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.split div{background:var(--p-light);border-radius:2px;padding:11px 12px}
.split b{display:block;font-weight:700;font-size:19px;color:var(--p-dark);line-height:1}
.split span{display:block;font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--p-deep);opacity:.72;margin-top:5px}
.ai-out{background:var(--p-light);border:1px solid var(--line);border-left:2px solid var(--p-accent);border-radius:2px;padding:14px;margin-top:11px}
.ai-out h5{font-size:8.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--p-deep);margin-bottom:6px}
.ai-out h5:not(:first-child){margin-top:15px}
.ai-out p,.ai-out li{font-size:13.5px;line-height:1.65}
.ai-out ol,.ai-out ul{margin:0;padding-left:17px}
.ai-out li{margin-bottom:6px}

/* importação */
.imp-tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.imp-tbl th{text-align:left;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p-deep);opacity:.7;padding:6px 6px 8px;border-bottom:1px solid var(--line)}
.imp-tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.imp-tbl tr.novo td:first-child{border-left:2px solid var(--st-aprovado);padding-left:8px}
.imp-tbl tr.atualiza td:first-child{border-left:2px solid var(--st-aguardando);padding-left:8px}
.imp-tbl tr.erro td{color:var(--st-cancelado)}
.imp-sum{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;font-size:11px;font-weight:600}
.imp-sum span i{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:5px}

/* swatches */
.swatches{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sw{text-align:center}
.sw input[type=color]{width:42px;height:42px;border:1px solid var(--line);border-radius:var(--r);background:none;padding:2px}
.sw span{display:block;font-size:7.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p-deep);opacity:.7;margin-top:5px}

/* FAB + toast */
.fab{
  position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);
  width:52px;height:52px;border-radius:99px;background:var(--p-accent);color:var(--p-dark);
  display:grid;place-items:center;z-index:45;box-shadow:0 5px 18px rgba(0,0,0,.22);transition:.15s;
}
.fab:active{transform:scale(.9)}
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(14px);
  bottom:calc(var(--nav) + 26px);background:var(--ink);color:var(--paper);
  padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:500;z-index:130;
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;box-shadow:0 6px 22px rgba(0,0,0,.25);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast i{width:6px;height:6px;border-radius:99px;background:var(--lime);display:block}




/* ---- mês no celular: grade compacta ---- */
.grid.mini{gap:2px}
.cell.mini{
  min-height:48px;padding:5px 1px 4px;align-items:center;justify-content:flex-start;gap:4px;
  border:1px solid transparent;border-radius:6px;cursor:pointer;background:transparent;
}
.cell.mini .dnum{font-size:12.5px;font-weight:600;opacity:.8}
.cell.mini.today .dnum{width:22px;height:22px;font-size:11.5px}
.cell.mini .dots{display:flex;gap:2.5px;justify-content:center;flex-wrap:wrap;max-width:100%;min-height:5px}
.cell.mini .dots i{width:5px;height:5px;border-radius:99px;display:block;flex:0 0 5px}
.cell.mini .dots i.ev{background:transparent;box-shadow:inset 0 0 0 1.5px var(--p-dark)}
.cell.mini .cnt{font-size:8px;font-weight:700;opacity:.55;line-height:1}
.cell.mini.sel{background:var(--p-dark);border-color:var(--p-dark)}
.cell.mini.sel .dnum{color:var(--p-light);opacity:1}
.cell.mini.sel.today .dnum{background:var(--p-accent);color:var(--p-dark)}
.cell.mini.sel .dots i.ev{box-shadow:inset 0 0 0 1.5px var(--p-light)}
.cell.mini.sel .cnt{color:var(--p-light);opacity:.75}
.cell.mini.tem-late:not(.sel){border-color:color-mix(in srgb,var(--st-cancelado) 35%,transparent)}
.cell.mini.drop-on{background:color-mix(in srgb,var(--p-accent) 28%,transparent);border-color:var(--p-accent)}

/* ---- agenda do dia ---- */
.agenda{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.ag-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ag-h h3{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.25}
.ag-h span{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p-deep);opacity:.6}
.ag-list{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.ag-list .wchip h4{font-size:14.5px;line-height:1.3}
.ag-vazio{font-size:13px;color:var(--p-deep);opacity:.5;padding:10px 0}
.ag-add{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.ag-add button{
  padding:12px 8px;border:1px dashed color-mix(in srgb,var(--p-dark) 28%,transparent);border-radius:var(--r);
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--p-deep);
}
.ag-add button:active{background:color-mix(in srgb,var(--p-accent) 20%,transparent)}
.witems{min-width:0}
.wchip .wc-main{min-width:0}
.wchip h4{overflow-wrap:anywhere}



/* ---- campos e seletores ---- */
.fld{display:block;margin-top:18px}
.fld:first-child{margin-top:4px}
.fld .flbl{margin-top:0;margin-bottom:8px}
.txt.big{font-size:17px;font-weight:600;padding:13px 13px}
.txt.flash{animation:flashFld .45s ease}
@keyframes flashFld{0%{background:color-mix(in srgb,var(--p-accent) 35%,#fff)}100%{background:var(--white)}}

.opts{display:grid;gap:6px;margin-top:0}
.opts.grid4{grid-template-columns:repeat(3,1fr)}
.opts.grid2{grid-template-columns:repeat(2,1fr)}
.opts.fila{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.opts.fila::-webkit-scrollbar{display:none}

.opt{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:12px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--white);
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--p-deep);
  transition:.14s;min-height:56px;
}
.opt svg{width:16px;height:16px;opacity:.65}
.opt span{line-height:1.2;text-align:center}
.opt:active{transform:scale(.96)}
.opt.on{
  background:var(--p-dark);border-color:var(--p-dark);color:var(--p-light);
  box-shadow:inset 0 -2.5px 0 var(--p-accent);
}
.opt.on svg{opacity:1}
.opt.lin{flex-direction:row;justify-content:flex-start;gap:8px;min-height:0;padding:11px 11px;text-transform:none;letter-spacing:.01em;font-size:11.5px;font-weight:600}
.opt.lin .pt{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
.opt.lin span{text-align:left}
.opt.chip-opt{
  flex:0 0 auto;flex-direction:row;min-height:0;padding:9px 14px;border-radius:99px;
  text-transform:none;letter-spacing:.01em;font-size:12px;font-weight:600;white-space:nowrap;
}
.opt.chip-opt.on{box-shadow:none}

.quick{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.quick button{
  padding:7px 12px;border:1px dashed color-mix(in srgb,var(--p-dark) 24%,transparent);
  border-radius:99px;font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--p-deep);transition:.14s;
}
.quick button:active{background:var(--p-accent);border-color:var(--p-accent);color:var(--p-dark)}
@media (prefers-color-scheme: dark){
  .opt{color:#FFFDF8;background:color-mix(in srgb,var(--p-dark) 82%,#000);border-color:rgba(255,255,255,.14)}
  .opt.on{background:#FFFDF8;color:var(--p-dark);border-color:#FFFDF8}
  .quick button{color:#FFFDF8;border-color:rgba(255,255,255,.28)}
}

/* ---- dias cheios ---- */
.chip.pill{display:flex;align-items:center;gap:3px;padding:2px 4px;font-size:7.5px;font-weight:700;letter-spacing:.04em;min-height:0}
.chip.pill svg{width:8px;height:8px;flex:0 0 8px}
.chip.compacto{display:flex;align-items:center;gap:3px;padding:2px 3px 2px 4px;min-height:0}
.chip.compacto svg{width:7px;height:7px;flex:0 0 7px;opacity:.6}
.chip.compacto span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.chip.compacto .c-fmt{font-weight:700;font-size:7.5px;letter-spacing:.02em;text-overflow:clip}
@media(max-width:619px){ .chip.compacto svg{display:none} .chip.compacto{padding:2px 2px 2px 4px} }
.chip.compacto .c-tt{display:none;font-weight:600;font-size:9px}
@media(min-width:620px){
  .chip.compacto .c-fmt{display:none}
  .chip.compacto .c-tt{display:block}
}

/* ---- marcador do cliente ----
   O app é sempre Cultura Growth. A cor do cliente aparece apenas
   como sinal de onde você está: barra no topo e ponto no nome. */
.mk-bar{height:3px;background:var(--marca,#C4F23B)}
.mk-dot{
  display:inline-block;width:7px;height:7px;border-radius:99px;
  background:var(--marca,#C4F23B);margin-right:8px;vertical-align:middle;
  transform:translateY(-1px);
}

/* ============ NOTIFICAÇÕES ============ */
.sino{position:relative}
.sino .bdg{
  position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;padding:0 3px;
  border-radius:99px;background:var(--st-cancelado);color:#fff;font-size:8.5px;
  font-weight:700;font-style:normal;display:grid;place-items:center;line-height:1;
}
.centro{background:var(--paper);min-height:100vh;padding-bottom:40px;overscroll-behavior:contain}
.ct-top{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--ink);color:var(--paper);
  padding:calc(env(safe-area-inset-top) + 16px) 18px 16px;
}
.ct-top h3{font-weight:700;font-size:18px;letter-spacing:-.01em}
.ct-top .ic-btn{width:38px;height:38px;flex:0 0 38px;background:rgba(255,255,255,.12);opacity:1}
.ct-top .ic-btn svg{width:17px;height:17px}
.ct-perm{margin:16px;padding:14px 15px;border:1px solid rgba(17,17,15,.12);border-left:2px solid var(--st-aguardando);border-radius:3px;background:#fff}
.ct-perm.ok{border-left-color:var(--st-publicado)}
.ct-perm p{font-size:13px;line-height:1.55;color:#3F3E35}
.ct-perm .act{margin-top:11px;width:100%;flex:none}
.ct-prefs{margin:0 16px 8px;border:1px solid rgba(17,17,15,.1);border-radius:3px;background:#fff}
.ct-sw{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid rgba(17,17,15,.08)}
.ct-sw:last-child{border-bottom:0}
.ct-sw span{font-size:13.5px}
.ct-sw input{width:20px;height:20px;accent-color:#11110F}
.ct-list{margin:8px 0 0}
.ct-item{

/* ============================================================

   Registro compartilhado de eventos no Supabase. Cada evento tem id

const EQUIPE=['Bruno','Dacal'];
const TIPOS_NOTIF={
  comentario:{icone:'💬',titulo:'Novo comentário'},
  anexo:{icone:'📎',titulo:'Novo conteúdo anexado'}
};
const PREF_KEY='cg-notif-prefs';
const ENTREGUES='cg-notif-entregues';

function prefsNotif(){
  try{ return JSON.parse(localStorage.getItem(PREF_KEY))||{comentario:true,anexo:true}; }
  catch(e){ return {comentario:true,anexo:true}; }
}
function setPref(k,v){ const p=prefsNotif(); p[k]=v; localStorage.setItem(PREF_KEY,JSON.stringify(p)); render(); }

/* cria um evento — dedupe por id determinístico */
function notificar(tipo,{refId,texto,post}){
  const de=quemSou()||'Equipe';
  const para=EQUIPE.filter(n=>n!==de);
  if(!para.length) return;
  DB.notif=DB.notif||[];
  const id=[tipo,projAtual,refId,de,Date.now()].join(':');
  /* evita duplicata do mesmo evento em janela curta */
  const janela=Date.now()-8000;
  const repetido=DB.notif.some(n=>n.tipo===tipo&&n.refId===refId&&n.de===de&&n.ts>janela);
  if(repetido) return;
  DB.notif.push({
    id,tipo,de,para,refId,texto,
    projeto:projAtual, projNome:P()?.nome||'', mes:(post?.date||'').slice(0,7),
    titulo:post?.concept||'', ts:Date.now(), quando:agora(), lidoPor:[]
  });
  if(DB.notif.length>150) DB.notif=DB.notif.slice(-150);
  salvar();
}
const minhasNotif=()=>{
  const eu=quemSou();
  return (DB.notif||[]).filter(n=>n.para.includes(eu)).sort((a,b)=>b.ts-a.ts);
};
const naoLidas=()=>minhasNotif().filter(n=>!n.lidoPor.includes(quemSou())).length;
function marcarLida(id){
  const n=(DB.notif||[]).find(x=>x.id===id); if(!n) return;
  const eu=quemSou(); if(!n.lidoPor.includes(eu)) n.lidoPor.push(eu);
  salvar();
}
function marcarTodasLidas(){
  const eu=quemSou();
  minhasNotif().forEach(n=>{ if(!n.lidoPor.includes(eu)) n.lidoPor.push(eu); });
  salvar(); render();
}

/* ---- permissão ---- */
const temNotifAPI=()=>typeof Notification!=='undefined';
const instalado=()=>window.matchMedia?.('(display-mode: standalone)')?.matches || window.navigator.standalone===true;
const ehIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent||'');
function estadoPermissao(){
  if(!temNotifAPI()) return 'indisponivel';
  if(ehIOS()&&!instalado()) return 'precisa-instalar';
  return Notification.permission;   // default | granted | denied
}
async function pedirPermissao(){
  const e=estadoPermissao();
  if(e==='precisa-instalar'){
    alert('No iPhone, as notificações só funcionam com o Studio adicionado à Tela de Início.\n\nSafari → botão Compartilhar → Adicionar à Tela de Início. Depois abra pelo ícone e ative aqui de novo.');
    return;
  }
  if(e==='indisponivel'){ toast('Este navegador não suporta notificações'); return; }
  if(e==='denied'){
    alert('As notificações foram bloqueadas.\n\nAjustes do aparelho → Notificações → Cultura Studio, e permita. Depois volte aqui.');
    return;
  }
  if(e==='granted'){ toast('Notificações já estão ativas'); return; }
  const r=await Notification.requestPermission();
  render();
  toast(r==='granted'?'Notificações ativadas':'Permissão não concedida');
}

/* ---- entrega no aparelho ---- */
function jaEntregue(id){
  try{ return (JSON.parse(localStorage.getItem(ENTREGUES))||[]).includes(id); }catch(e){ return false; }
}
function marcarEntregue(id){
  let a=[]; try{ a=JSON.parse(localStorage.getItem(ENTREGUES))||[]; }catch(e){}
  a.push(id); if(a.length>200) a=a.slice(-200);
  localStorage.setItem(ENTREGUES,JSON.stringify(a));
}
function entregarPendentes(){
  if(estadoPermissao()!=='granted') return;
  const eu=quemSou(); if(!eu) return;
  const prefs=prefsNotif();
  minhasNotif()
    .filter(n=>!n.lidoPor.includes(eu) && !jaEntregue(n.id) && prefs[n.tipo]!==false)
    .slice(0,3)
    .forEach(n=>{
      marcarEntregue(n.id);
      try{
        const t=TIPOS_NOTIF[n.tipo]||{icone:'•',titulo:'Atualização'};
        const nt=new Notification(`${t.icone} ${t.titulo}`,{
          body:n.texto, tag:n.id, badge:'/icon.png',
          data:{link:linkNotif(n)}
        });
        nt.onclick=()=>{ window.focus(); abrirNotif(n.id); nt.close(); };
      }catch(e){ /* alguns navegadores exigem service worker */ }
    });
}
const linkNotif=n=>`#p=${n.projeto}&m=${n.mes}&post=${n.refId}`;

/* ---- deep link ---- */
function abrirNotif(id){
  const n=(DB.notif||[]).find(x=>x.id===id); if(!n) return;
  marcarLida(id);
  centroAberto=false;
  if(!DB.projetos[n.projeto]){ render(); toast('Projeto não encontrado'); return; }
  projAtual=n.projeto; aplicaTema(TEMA_CG); setMarca(P().tema); document.body.classList.add('inproj');
  mesAtual=n.mes||MES_HOJE; tab='cal'; config=false;
  render();
  const alvo=acha(n.refId);
  if(alvo){ abrir(n.refId,'post');
    setTimeout(()=>{ const ta=document.getElementById('ta-'+n.refId); ta&&ta.scrollIntoView({block:'center',behavior:'smooth'}); },220);
  }else toast('Post não encontrado neste mês');
}
function lerHash(){
  const h=location.hash||''; if(!h.includes('post=')) return false;
  const q=Object.fromEntries(h.slice(1).split('&').map(s=>s.split('=')));
  if(!q.p||!DB.projetos[q.p]) return false;
  projAtual=q.p; aplicaTema(TEMA_CG); setMarca(P().tema); document.body.classList.add('inproj');
  mesAtual=q.m||MES_HOJE; render();
  if(q.post&&acha(q.post)){ abrir(q.post,'post'); }
  history.replaceState(null,'',location.pathname);
  return true;
}

async function carregar(){
  try{ const v=await store.get(); if(v) DB=JSON.parse(v); }catch(e){ DB={projetos:{}}; }
  DB.projetos=DB.projetos||{};
  if(!Object.keys(DB.projetos).length){

        '2026-08':{posts:SEED_CASA.map(p=>({id:uid('p'),status:'aguardando',mx:{},tasks:[],log:[],...p})),eventos:[]},
        '2026-09':{posts:SEED_SET.map(p=>({id:uid('p'),status:'aguardando',mx:{},tasks:[],log:[],...p})),eventos:[]}
      }
    };
    await salvar();
  }
  /* normalização: garante campos novos sem quebrar dados existentes */
  let mudou=false;
  Object.values(DB.projetos).forEach(pr=>{
    pr.meses=pr.meses||{};
    Object.values(pr.meses).forEach(m=>{
      if(!m.eventos){ m.eventos=[]; mudou=true; }
      (m.posts||[]).forEach(p=>{
        if(!p.tasks){ p.tasks=[]; mudou=true; }
        if(!p.log){ p.log=[]; mudou=true; }
        if(!STATUS[p.status]){ p.status=MIGRA[p.status]||'rascunho'; mudou=true; }
      });
    });
  });
  const cl=DB.projetos['casa-llamarada'];
  if(cl&&cl.meses&&!cl.meses['2026-09']){
    cl.meses['2026-09']={posts:SEED_SET.map(p=>({id:uid('p'),status:'aguardando',mx:{},tasks:[],log:[],...p})),eventos:[]};
    mudou=true;
  }
  if(mudou) await salvar();
  render();
}

function setMarca(t){
  const r=document.documentElement.style;

function passaFiltro(p){
  if(filtrosOn.status.length && !filtrosOn.status.includes(stOf(p))) return false;
  if(filtrosOn.fmt.length && !filtrosOn.fmt.includes(p.fmt)) return false;
  return true;
}
function toggleFiltro(tipo,val){
  const a=filtrosOn[tipo]; const i=a.indexOf(val);
  if(i<0) a.push(val); else a.splice(i,1);
  render();
}
function limparFiltros(){ filtrosOn={status:[],fmt:[]}; render(); }
const nFiltros=()=>filtrosOn.status.length+filtrosOn.fmt.length;

  if(diaSel && diaSel.slice(0,7)===mesAtual) return diaSel;

  const sel=diaPadrao();
  let cells='';
  for(let i=0;i<first;i++) cells+=`<div class="cell mini pad"></div>`;
  for(let d=1;d<=dias;d++){

function viewCal(){
  if(vista==='semana') return viewSemana();
  const [a,m]=mesAtual.split('-').map(Number);
  const first=new Date(a,m-1,1).getDay();
  const dias=new Date(a,m,0).getDate();
  const ps=posts().filter(passaFiltro), evs=eventos();

  let cells='';
  for(let i=0;i<first;i++) cells+=`<div class="cell pad"></div>`;
  for(let d=1;d<=dias;d++){
    const iso=`${a}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dp=ps.filter(p=>p.date===iso), de=evs.filter(e=>e.date===iso);
    /* até 2 posts: cards completos. 3 ou mais: todos viram linha única. */
    const denso = dp.length>=3 || (dp.length+de.length)>=3;
    const cap = denso ? 4 : 2;
    const de2 = de.slice(0, cap);
    const ps2 = dp.slice(0, Math.max(0, cap - de2.length));
    const itens=[...de2.map(e=>chipEvento(e,denso)),...ps2.map(p=>denso?chipCompacto(p):chipPost(p))];
    const mostra=itens;
    const resto=(dp.length+de.length)-itens.length;
    cells+=`<div class="cell ${iso===ISO_HOJE?'today':''} ${!itens.length?'livre':''}" data-date="${iso}"
        ${!itens.length?`onclick="novoEventoEm('${iso}')"`:''}>

/* ============================================================
   DRAG & DROP (pointer events, funciona com toque)
   ============================================================ */
let dragSt=null;
function pdown(ev,id,tipo){
  if(ev.button && ev.button!==0) return;
  const el=ev.currentTarget;
  dragSt={id,tipo,el,x0:ev.clientX,y0:ev.clientY,ativo:false,pid:ev.pointerId,
    timer:setTimeout(()=>iniciaDrag(ev.clientX,ev.clientY),320)};
  el.setPointerCapture?.(ev.pointerId);
  el.addEventListener('pointermove',pmove);
  el.addEventListener('pointerup',pup);
  el.addEventListener('pointercancel',pup);
}
function iniciaDrag(x,y){
  if(!dragSt) return;
  dragSt.ativo=true; arrastando=true;
  document.body.classList.add('dragging');
  if(navigator.vibrate) navigator.vibrate(12);
  const g=document.getElementById('dragghost');
  g.innerHTML=dragSt.el.outerHTML;
  const c=g.firstElementChild; if(c){ c.style.width='100%'; c.removeAttribute('onpointerdown'); }
  g.style.display='block';
  moveGhost(x,y);
  dragSt.el.classList.add('ghost');
}
function moveGhost(x,y){
  const g=document.getElementById('dragghost');
  g.style.left=(x-55)+'px'; g.style.top=(y-22)+'px';
}
function pmove(ev){
  if(!dragSt) return;
  const dx=Math.abs(ev.clientX-dragSt.x0), dy=Math.abs(ev.clientY-dragSt.y0);
  if(!dragSt.ativo){
    if(dx>9||dy>9){ clearTimeout(dragSt.timer); }   // virou scroll
    return;
  }
  ev.preventDefault();
  moveGhost(ev.clientX,ev.clientY);
  const g=document.getElementById('dragghost'); g.style.display='none';
  const sob=document.elementFromPoint(ev.clientX,ev.clientY);
  g.style.display='block';
  document.querySelectorAll('.drop-on').forEach(e=>e.classList.remove('drop-on'));
  const alvo=sob&&sob.closest('[data-date]');
  if(alvo) alvo.classList.add('drop-on');
  dragSt.alvo=alvo?alvo.dataset.date:null;
}
function pup(ev){
  if(!dragSt) return;
  clearTimeout(dragSt.timer);
  const {el,ativo,alvo,id,tipo}=dragSt;
  el.removeEventListener('pointermove',pmove);
  el.removeEventListener('pointerup',pup);
  el.removeEventListener('pointercancel',pup);
  el.classList.remove('ghost');
  document.querySelectorAll('.drop-on').forEach(e=>e.classList.remove('drop-on'));
  const g=document.getElementById('dragghost'); g.style.display='none'; g.innerHTML='';
  document.body.classList.remove('dragging');
  arrastando=false;
  const era=dragSt; dragSt=null;
  if(!ativo){ abrir(id,tipo); return; }          // foi toque simples
  if(alvo) moverItem(id,tipo,alvo);
}
function moverItem(id,tipo,novaData){
  const it = tipo==='evento'?achaEv(id):acha(id);
  if(!it||it.date===novaData) { render(); return; }
  const antes=it.date;
  const mk=novaData.slice(0,7);
  it.date=novaData;
  it.log=it.log||[];
  it.log.push({quem:quemSou()||'Equipe',quando:agora(),
    texto:`Reagendado de ${fmtCurta(antes)} para ${fmtCurta(novaData)}.`});
  if(mk!==mesAtual){
    const lista = tipo==='evento'?'eventos':'posts';
    M()[lista]=M()[lista].filter(x=>x.id!==id);
    P().meses[mk]=P().meses[mk]||{posts:[],eventos:[]};
    P().meses[mk].eventos=P().meses[mk].eventos||[];
    P().meses[mk][lista].push(it);
    salvar(); render();
    toast(`Movido para ${MES_CURTO[Number(mk.slice(5))-1]}`);
    return;
  }
  salvar(); render();
  toast(tipo==='evento'?'Reunião reagendada':'Post reagendado');
}

/* ---------- tarefas ---------- */
function addTask(id){
  const p=acha(id); const i=document.getElementById('nt-'+id);
  const t=i.value.trim(); if(!t){ i.focus(); return; }
  p.tasks=p.tasks||[];
  p.tasks.push({id:uid('t'),txt:t,done:false});
  salvar(); pintaSheet();
  const n=document.getElementById('nt-'+id); if(n) n.focus();
  toast('Tarefa criada');
}
function toggleTask(id,tid){
  const p=acha(id); const t=(p.tasks||[]).find(x=>x.id===tid); if(!t) return;
  t.done=!t.done;
  salvar(); pintaSheet();
  if(t.done) toast('Tarefa concluída');
}
function delTask(id,tid){
  const p=acha(id); p.tasks=(p.tasks||[]).filter(x=>x.id!==tid);
  salvar(); pintaSheet();
}

/* ---------- status / observações ---------- */
function setStatus(id,st){
  const p=acha(id); if(p.status===st) return;
  p.status=st; p.quando=agora(); p.porQuem=quemSou()||'Equipe';
  p.log=p.log||[];
  p.log.push({quem:p.porQuem,quando:p.quando,texto:'Status: '+STATUS[st].label.toLowerCase()+'.'});
  salvar(); pintaSheet(); toast(STATUS[st].label);
}
function comentar(id,tipo){
  const it=tipo==='evento'?achaEv(id):acha(id);
  const ta=document.getElementById('ta-'+id); const t=ta?ta.value.trim():'';
  if(!t){ ta?.focus(); return; }
  it.log=it.log||[];
  it.log.push({quem:quemSou()||'Equipe',quando:agora(),texto:t});
  it.quando=agora();
  if(tipo!=='evento') notificar('comentario',{refId:id,post:it,
    texto:`${quemSou()||'Alguém'} comentou em "${it.concept}".`});
  salvar(); pintaSheet(); toast('Observação salva');
}
function setMx(id,k,v){
  const p=acha(id); p.mx=p.mx||{};
  p.mx[k]=v===''?'':Math.max(0,parseInt(v,10)||0);
  salvar();
}

/* ---- controles ---- */
function escolher(id,val,el){
  const c=document.getElementById(id); if(c) c.value=val;
  [...el.parentNode.children].forEach(b=>b.classList.toggle('on',b===el));
  if(navigator.vibrate) navigator.vibrate(6);
}
function setCampo(id,val){
  const c=document.getElementById(id); if(!c) return;
  c.value=val; c.classList.add('flash');
  setTimeout(()=>c.classList.remove('flash'),450);
  const g=document.querySelector(`[data-quick="${id}"]`);
  if(g) [...g.children].forEach(b=>b.classList.toggle('on',b.dataset.v===val));
}
function addDias(iso,n){
  const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

function salvarPost(id){
  const p=acha(id); if(!p) return;
  const g=x=>{const e=document.getElementById('f-'+x);return e?e.value.trim():'';};
  const nd=g('date')||p.date;
  Object.assign(p,{concept:g('concept')||'Sem título',hora:g('hora'),fmt:g('fmt'),pilar:g('pilar'),
    status:g('status')||p.status,hook:g('hook'),material:g('material'),caption:g('caption'),
    cta:g('cta'),tags:g('tags'),flag:g('flag'),date:nd});
  const mk=nd.slice(0,7);
  if(mk!==mesAtual){
    M().posts=M().posts.filter(x=>x.id!==id);
    P().meses[mk]=P().meses[mk]||{posts:[],eventos:[]};
    P().meses[mk].eventos=P().meses[mk].eventos||[];
    P().meses[mk].posts.push(p);
    salvar(); fechar(); mesAtual=mk; render();
    toast('Movido para '+MES_CURTO[Number(mk.slice(5))-1]); return;
  }
  editando=false; salvar(); pintaSheet(); toast('Post salvo');
}

/* ---- exportação para calendário ---- */
function minutosDe(dur){
  const s=(dur||'').toLowerCase();
  const h=s.match(/(\d+)\s*h/); const m=s.match(/(\d+)\s*m/);
  let t=0; if(h) t+=parseInt(h[1],10)*60; if(m) t+=parseInt(m[1],10);
  if(!t){ const n=s.match(/(\d+)/); t=n?parseInt(n[1],10):30; }
  return t||30;
}
function janelaEvento(e){
  const [H,Mi]=(e.hora||'10:00').split(':').map(n=>parseInt(n,10)||0);
  const ini=new Date(e.date+'T00:00:00'); ini.setHours(H,Mi,0,0);
  const fim=new Date(ini.getTime()+minutosDe(e.dur)*60000);
  const f=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')
    +'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
  return {ini:f(ini),fim:f(fim)};
}
function descEvento(e){
  const partes=[e.tipo||'Reunião'];
  if(e.pessoas) partes.push('Participantes: '+e.pessoas);
  if(e.obs) partes.push(e.obs);
  partes.push(P().nome+' · Cultura Growth Studio');
  return partes.join('\n');
}
function baixarICS(id){
  const e=achaEv(id); if(!e) return;
  const {ini,fim}=janelaEvento(e);
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cultura Growth//Studio//PT','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT','UID:'+e.id+'@culturagrowth',
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',
    'DTSTART:'+ini,'DTEND:'+fim,
    'SUMMARY:'+icsEsc(e.titulo),
    'DESCRIPTION:'+icsEsc(descEvento(e)),
    'LOCATION:'+icsEsc(e.local||''),
    'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.titulo),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const b=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=(e.titulo||'reuniao').replace(/[^\w\-]+/g,'-').toLowerCase()+'.ics';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  toast('Abra o arquivo para adicionar');
}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function abrirGoogleCal(id){
  const e=achaEv(id); if(!e) return;
  const {ini,fim}=janelaEvento(e);
  const u='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(e.titulo||'Reunião')
    +'&dates='+ini+'/'+fim
    +'&details='+encodeURIComponent(descEvento(e));
  window.open(u,'_blank');
}

/* ============================================================
   MÍDIA
   ============================================================ */
function embed(u){ u=(u||'').trim(); let m;
  if(u.includes('/storage/v1/object/public/')) return {t:/\.(png|jpe?g|webp|gif|heic)$/i.test(u)?'img':'v',s:u};
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return {t:'i',s:`https://drive.google.com/file/d/${m[1]}/preview`};
  if((m=u.match(/drive\.google\.com\/open\?id=([\w-]+)/))) return {t:'i',s:`https://drive.google.com/file/d/${m[1]}/preview`};
  if((m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]+)/))) return {t:'i',s:`https://www.youtube.com/embed/${m[1]}`};
  if((m=u.match(/vimeo\.com\/(\d+)/))) return {t:'i',s:`https://player.vimeo.com/video/${m[1]}`};
  if(/dropbox\.com\/.+\.(mp4|mov|m4v)/i.test(u)) return {t:'v',s:u.replace(/[?&]dl=0/,'')+(u.includes('?')?'&':'?')+'raw=1'};
  if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u)) return {t:'v',s:u};
  return null; }
function blocoMidia(p){
  if(p.enviando) return `<h4 class="lbl">Vídeo para aprovação</h4><p class="pending"><span class="dot"></span>Enviando para a nuvem…</p>`;
  if(!p.midia) return `<h4 class="lbl">Vídeo para aprovação</h4>
    <div class="drop"><p>Escolha um arquivo do celular, ou cole um link do Drive, YouTube, Vimeo ou Dropbox.</p>
      <div class="btns"><button class="act ghost" onclick="document.getElementById('file-${p.id}').click()">Escolher do celular</button></div>
      <input type="file" id="file-${p.id}" accept="video/*,image/*" style="display:none" onchange="subirArquivo('${p.id}',this)">
      <input class="txt" id="mid-${p.id}" type="url" placeholder="https://drive.google.com/file/d/...">
      <div class="btns"><button class="act ghost" onclick="setMidia('${p.id}')">Usar link</button></div>
      <p style="font-size:10.5px;opacity:.6;margin-top:9px">Até 45 MB. A equipe inteira vê o que for enviado.</p></div>`;
  const e=embed(p.midia);
  return `<h4 class="lbl">Vídeo para aprovação</h4>
    ${e?`<div class="player">${
      e.t==='i'?`<iframe src="${e.s}" allow="autoplay; fullscreen" allowfullscreen title="Prévia"></iframe>`
      :e.t==='img'?`<img src="${e.s}" alt="">`
      :`<video src="${e.s}" controls playsinline preload="metadata"></video>`}</div>`
     :`<div class="drop"><p>Link anexado, sem prévia embutida.</p></div>`}
    <div class="mbar"><a href="${esc(p.midia)}" target="_blank" rel="noopener">Abrir em nova aba</a>
      <button class="link-btn" onclick="tiraMidia('${p.id}')">Trocar</button>
      ${p.midiaNome?`<span style="opacity:.6">${esc(p.midiaNome)}</span>`:''}</div>`;
}
function setMidia(id){ const p=acha(id),i=document.getElementById('mid-'+id),v=i.value.trim();
  if(!v){i.focus();return;} p.midia=v; p.midiaNome='';
  p.log=p.log||[]; p.log.push({quem:quemSou()||'Equipe',quando:agora(),texto:'Anexou um link de mídia.'});
  notificar('anexo',{refId:p.id,post:p,texto:`Um novo conteúdo foi anexado ao post "${p.concept}".`});
  salvar(); pintaSheet(); toast('Link anexado'); }
function tiraMidia(id){ const p=acha(id); p.midia=''; p.midiaNome=''; salvar(); pintaSheet(); }
function subirArquivo(id,inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>45*1024*1024){ toast('Acima de 45 MB. Use link.'); inp.value=''; return; }
  const p=acha(id); p.enviando=true; pintaSheet();
  enviarStorage(f,f.name).then(url=>{
    p.midia=url; p.midiaNome=f.name; p.midiaTipo=f.type; p.enviando=false;
    p.log=p.log||[];
    p.log.push({quem:quemSou()||'Equipe',quando:agora(),texto:'Anexou '+f.name+'.'});
    notificar('anexo',{refId:p.id,post:p,
      texto:`Um novo arquivo foi anexado ao post "${p.concept}".`});
    salvar(); pintaSheet(); toast('Arquivo enviado');
  }).catch(()=>{ p.enviando=false; pintaSheet(); toast('Falha no envio'); });
}
async function avisar(id){
  const p=acha(id);
  const d=new Date(p.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long'});
  const t=`${P().nome} · ${d}\n${p.concept} · ${p.fmt}\n${p.midia?'Vídeo anexado e pronto para revisão.':'Conteúdo atualizado.'}\n${location.href}`;
  try{ await navigator.clipboard.writeText(t); toast('Aviso copiado'); }catch(e){ prompt('Copie:',t); }
}

      <div class="btns"><button class="act solid" onclick="salvarConfig()">Aplicar</button></div>

    <div class="panel"><h3>Importar calendário</h3>

      <div class="btns"><button class="act danger" onclick="apagarProjeto()">Excluir projeto</button></div>

}
function salvarConfig(){
  const p=P(),g=x=>document.getElementById('c-'+x).value;

  setMarca(p.tema); salvar(); render(); toast('Cor do cliente atualizada');
}
function apagarProjeto(){
  if(!confirm('Excluir este projeto e todo o conteúdo dele?')) return;
  delete DB.projetos[projAtual]; salvar(); voltarHome();

/* ============================================================
   IMPORTAÇÃO VIA JSON (preparado para Claude)
   ============================================================ */
const MAPA_TIPO={reel:'Reel',carousel:'Carrossel',carrossel:'Carrossel',photo:'Foto',foto:'Foto',
  story:'Story',video:'Vídeo','vídeo':'Vídeo',static:'Estático','estático':'Estático'};
const MAPA_ST={draft:'rascunho',rascunho:'rascunho',production:'producao',producao:'producao',
  approval:'aguardando',aguardando:'aguardando',approved:'aprovado',aprovado:'aprovado',
  published:'publicado',publicado:'publicado',cancelled:'cancelado',cancelado:'cancelado',
  changes:'ajustar',ajustar:'ajustar',client:'aguardando_cli'};

function validarImport(){
  const raw=document.getElementById('impjson').value.trim();
  if(!raw){ toast('Cole o JSON primeiro'); return; }
  let j;
  try{ j=JSON.parse(raw); }catch(e){ importPreview={erro:'JSON inválido: '+e.message}; render(); return; }
  const lista=Array.isArray(j)?j:(j.posts||j.itens||[]);
  if(!lista.length){ importPreview={erro:'Nenhum post encontrado no JSON.'}; render(); return; }

  const linhas=[];
  lista.forEach((it,i)=>{
    const erros=[];
    const date=(it.date||it.data||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) erros.push('data inválida');
    else if(isNaN(new Date(date+'T12:00:00').getTime())) erros.push('data inexistente');
    const titulo=(it.title||it.titulo||it.concept||'').trim();
    if(!titulo) erros.push('título vazio');
    const tipoRaw=(it.type||it.tipo||it.fmt||'Reel').toString().toLowerCase();
    const fmt=MAPA_TIPO[tipoRaw]||(FORMATOS[it.type]?it.type:null);
    if(!fmt) erros.push('formato "'+tipoRaw+'" desconhecido');
    const stRaw=(it.status||'rascunho').toString().toLowerCase();
    const status=MAPA_ST[stRaw]||(STATUS[stRaw]?stRaw:null);
    if(!status) erros.push('status "'+stRaw+'" desconhecido');

    let acao='novo', alvo=null;
    if(!erros.length){
      const mk=date.slice(0,7);
      const lista2=(P().meses?.[mk]?.posts)||[];
      alvo=lista2.find(p=>
        (it.externalId&&p.externalId===it.externalId) ||
        (p.date===date && p.fmt===fmt && p.concept.toLowerCase()===titulo.toLowerCase())
      );
      if(alvo) acao='atualiza';
    }
    linhas.push({i,date,titulo,fmt,status,erros,acao,alvoId:alvo?.id,
      hora:(it.time||it.hora||'').trim(),notes:(it.notes||it.material||'').trim(),
      pilar:(it.pillar||it.pilar||'').trim(),externalId:it.externalId||null});
  });
  importPreview={linhas}; render();
  setTimeout(()=>{const e=document.getElementById('impjson');e&&e.scrollIntoView({block:'center'});},50);
}
function renderPreview(){
  if(importPreview.erro) return `<p class="err">${esc(importPreview.erro)}</p>`;
  const L=importPreview.linhas;
  const ok=L.filter(l=>!l.erros.length);
  const novos=ok.filter(l=>l.acao==='novo').length;
  const upd=ok.filter(l=>l.acao==='atualiza').length;
  const err=L.filter(l=>l.erros.length);
  return `
  <div class="imp-sum">
    <span><i style="background:var(--st-aprovado)"></i>${novos} novo${novos===1?'':'s'}</span>
    <span><i style="background:var(--st-aguardando)"></i>${upd} atualiza${upd===1?'':'m'}</span>
    ${err.length?`<span><i style="background:var(--st-cancelado)"></i>${err.length} com erro</span>`:''}
  </div>
  <table class="imp-tbl"><thead><tr><th>Data</th><th>Tipo</th><th>Conteúdo</th><th>Status</th></tr></thead>
  <tbody>${L.slice(0,30).map(l=>`<tr class="${l.erros.length?'erro':l.acao}">
    <td>${esc(l.date||'—')}</td><td>${esc(l.fmt||'—')}</td>
    <td>${esc(l.titulo||'—')}${l.erros.length?`<br><small>${esc(l.erros.join(', '))}</small>`:''}</td>
    <td>${l.status?STATUS[l.status].label:'—'}</td></tr>`).join('')}</tbody></table>
  ${L.length>30?`<p class="empty" style="margin-top:8px">Mostrando 30 de ${L.length}.</p>`:''}
  ${ok.length?`<div class="btns"><button class="act solid" onclick="executarImport()">Importar ${ok.length} post${ok.length===1?'':'s'}</button>
    <button class="act ghost" onclick="importPreview=null;render()">Cancelar</button></div>`
    :`<p class="err">Nenhum post válido para importar.</p>`}`;
}
function executarImport(){
  const L=importPreview.linhas.filter(l=>!l.erros.length);
  let novos=0,upd=0;
  L.forEach(l=>{
    const mk=l.date.slice(0,7);
    P().meses[mk]=P().meses[mk]||{posts:[],eventos:[]};
    P().meses[mk].eventos=P().meses[mk].eventos||[];
    if(l.acao==='atualiza'&&l.alvoId){
      const p=P().meses[mk].posts.find(x=>x.id===l.alvoId);
      if(p){ Object.assign(p,{concept:l.titulo,fmt:l.fmt,status:l.status,
        hora:l.hora||p.hora,material:l.notes||p.material,pilar:l.pilar||p.pilar,externalId:l.externalId||p.externalId});
        upd++; }
    }else{
      P().meses[mk].posts.push({id:uid('p'),date:l.date,concept:l.titulo,fmt:l.fmt,status:l.status,
        hora:l.hora||'18:00',material:l.notes,pilar:l.pilar||PILARES[0],externalId:l.externalId,
        mx:{},tasks:[],log:[{quem:quemSou()||'Equipe',quando:agora(),texto:'Criado por importação.'}]});
      novos++;
    }
  });
  importPreview=null; salvar(); render();
  toast(`${novos} criado${novos===1?'':'s'}, ${upd} atualizado${upd===1?'':'s'}`);
}

/* ============================================================
   MÉTRICAS
   ============================================================ */
function totais(mk){
  const ps=(P()?.meses?.[mk]?.posts)||[];
  const t={alcance:0,curtidas:0,salvos:0,compart:0,coment:0,n:0};
  ps.forEach(p=>{ if(p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null)){
    t.n++; CAMPOS.forEach(([k])=>t[k]+=Number(p.mx[k]||0)); } });
  return t;
}
function mesAnterior(){ const [a,m]=mesAtual.split('-').map(Number); const d=new Date(a,m-2,1); return chave(d.getFullYear(),d.getMonth()); }
function delta(x,y){ if(!y) return ''; const p=Math.round((x-y)/y*100);
  if(!isFinite(p)||!p) return ''; return `<em class="${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}% vs mês anterior</em>`; }

function viewMx(){
  const t=totais(mesAtual), ta=totais(mesAnterior());
  const ps=posts().filter(p=>p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null));
  const A=P().meses[mesAtual]?.analise;
  let h=`<div class="dash"><div class="kpis">
    <div class="kpi"><b>${num(t.alcance)}</b><span>Alcance</span>${delta(t.alcance,ta.alcance)}</div>
    <div class="kpi"><b>${num(t.salvos)}</b><span>Salvos</span>${delta(t.salvos,ta.salvos)}</div>
    <div class="kpi"><b>${num(t.compart)}</b><span>Compartilham.</span>${delta(t.compart,ta.compart)}</div>
    <div class="kpi"><b>${t.n}/${posts().length}</b><span>Com dados</span></div></div>`;
  if(ps.length){
    const grupo=c=>{ const g={};
      ps.forEach(p=>{ const k=p[c]||'—'; g[k]=g[k]||{al:0,sv:0,n:0};
        g[k].al+=Number(p.mx.alcance||0); g[k].sv+=Number(p.mx.salvos||0); g[k].n++; });
      return Object.entries(g).map(([k,v])=>({k,media:Math.round(v.al/v.n),sv:Math.round(v.sv/v.n),n:v.n})).sort((a,b)=>b.media-a.media); };
    h+=`<div class="panel"><h3>Alcance médio por formato</h3><div class="bars">${barras(grupo('fmt'))}</div></div>`;
    h+=`<div class="panel"><h3>Pilares que mais performam</h3><p class="lead">Ordenado por alcance médio.</p><div class="bars">${barras(grupo('pilar'),1)}</div></div>`;
    const can=ps.filter(p=>/canad|geotag/i.test(p.flag||'')), rest=ps.filter(p=>!/canad|geotag/i.test(p.flag||''));
    if(can.length){ const md=a=>a.length?Math.round(a.reduce((s,p)=>s+Number(p.mx.alcance||0),0)/a.length):0;
      h+=`<div class="panel"><h3>Teste de geotag</h3><p class="lead">Alcance médio com e sem marcação.</p>
        <div class="split"><div><b>${num(md(can))}</b><span>Com geotag · ${can.length}</span></div>
        <div><b>${num(md(rest))}</b><span>Sem geotag · ${rest.length}</span></div></div></div>`; }
    h+=`<div class="panel"><h3>Post a post</h3><div class="bars">${barras(ps.map(p=>({k:p.concept,media:Number(p.mx.alcance||0),sv:Number(p.mx.salvos||0),n:1})).sort((a,b)=>b.media-a.media),1)}</div></div>`;
  }
  h+=`<div class="panel"><h3>Leitura estratégica</h3><p class="lead">A IA lê o mês e compara com o anterior.</p>`;
  if(A) h+=`<div class="ai-out"><h5>Resumo</h5><p>${esc(A.resumo||'')}</p>
    <h5>O que funcionou</h5><ul>${(A.funcionou||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h5>Pontos de atenção</h5><ul>${(A.atencao||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${A.canada?`<h5>Teste de geotag</h5><p>${esc(A.canada)}</p>`:''}
    <h5>Ações para o próximo mês</h5><ol>${(A.acoes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
  if(analiseLoad) h+=`<p class="pending"><span class="dot"></span>Analisando o mês…</p>`;
  if(analiseErr) h+=`<p class="err">${esc(analiseErr)}</p>`;
  h+=`<div class="btns"><button class="act ghost" onclick="lerMes()" ${analiseLoad?'disabled':''}>${A?'Reanalisar':'Ler métricas com IA'}</button></div></div>`;
  h+=`<div class="panel"><h3>Planilha</h3>
    <p class="lead">Exporte para o Sheets ou cole o CSV para importar. Colunas: data, alcance, curtidas, salvos, compart, coment.</p>
    <div class="btns"><button class="act ghost" onclick="exportCSV()">Exportar CSV</button>
      <button class="act ghost" onclick="document.getElementById('imp').style.display='block'">Importar CSV</button></div>
    <div id="imp" style="display:none"><textarea id="csv" placeholder="2026-08-04,12400,318,96,44,12"></textarea>
      <div class="btns"><button class="act solid" onclick="importCSV()">Importar</button></div></div></div></div>`;
  return h;
}
function barras(arr,sv){
  const max=Math.max(...arr.map(x=>x.media),1);
  return arr.map((x,i)=>`<div class="bar-row">
    <span class="nm">${esc(x.k)}${x.n>1?`<small>${x.n} posts</small>`:''}</span>
    <span class="vl">${num(x.media)}${sv?`<small style="display:block;font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p-deep);opacity:.6;text-align:right">${num(x.sv)} salvos</small>`:''}</span>
    <span class="bar-track"><i class="${i===0?'hi':''}" style="width:${x.media/max*100}%"></i></span></div>`).join('');
}
async function claude(prompt,mx){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:mx||1200,messages:[{role:"user",content:prompt}]})});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const d=await r.json();
  const t=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  return JSON.parse(t.replace(/```json|```/g,"").trim());
}
async function lerMes(){
  const ps=posts().filter(p=>p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null));
  if(!ps.length){ analiseErr='Preencha as métricas de pelo menos um post antes.'; render(); return; }
  analiseLoad=true; analiseErr=''; render();
  const ant=(P().meses[mesAnterior()]?.posts||[]).filter(p=>p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null))
    .map(p=>({data:p.date,formato:p.fmt,pilar:p.pilar,...p.mx}));
  try{
    P().meses[mesAtual].analise=await claude(`You are the head of social strategy for ${P().nome}${P().tagline?' ('+P().tagline+')':''}.
${P().voz||''}

CURRENT MONTH:
${JSON.stringify(ps.map(p=>({data:p.date,formato:p.fmt,pilar:p.pilar,conceito:p.concept,obs:p.flag||'',...p.mx})),null,1)}

${ant.length?'PREVIOUS MONTH:\n'+JSON.stringify(ant,null,1):'No data for the previous month.'}

Analyse as a strategist, not a reporter. Weight saves and shares over likes, since they signal real intent. Cite the actual numbers behind each point.

Respond with ONLY a JSON object, no preamble, no markdown fences, all text in Brazilian Portuguese:
{"resumo":"two sentences","funcionou":["finding with numbers","another"],"atencao":["problem with numbers","another"],"canada":"what any geotag test suggests, or empty string","acoes":["action","another","another"]}`,1700);
  }catch(e){ analiseErr='Não consegui ler as métricas agora. Tente de novo.'; }
  analiseLoad=false; salvar(); render();
}
function exportCSV(){
  const L=[['data','conceito','formato','pilar','status',...CAMPOS.map(c=>c[0])].join(',')];
  posts().forEach(p=>L.push([p.date,`"${(p.concept||'').replace(/"/g,'""')}"`,p.fmt,p.pilar,stOf(p),...CAMPOS.map(([k])=>p.mx?.[k]??'')].join(',')));
  const b=new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=`${projAtual}-${mesAtual}.csv`; a.click(); URL.revokeObjectURL(a.href);
}
function importCSV(){
  const t=document.getElementById('csv').value.trim(); if(!t) return; let ok=0;
  t.split(/\r?\n/).forEach(l=>{
    const c=l.split(',').map(x=>x.trim()), d=c[0];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    const alvo=(P().meses[d.slice(0,7)]?.posts||[]).find(p=>p.date===d); if(!alvo) return;
    alvo.mx=alvo.mx||{};
    CAMPOS.forEach(([k],i)=>{ const v=c[i+1]; if(v!==undefined&&v!=='') alvo.mx[k]=parseInt(v,10)||0; });
    ok++;
  });
  salvar(); render(); toast(ok?`${ok} post${ok>1?'s':''} atualizado${ok>1?'s':''}`:'Nenhuma data bateu');
}
