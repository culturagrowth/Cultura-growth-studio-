<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12120F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<title>Cultura Growth · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Instrument+Serif&family=DM+Serif+Display&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* casca da agência */
  --ag-ink:#12120F; --ag-bone:#F5F2EA; --ag-amber:#B8873B; --ag-mute:#8A877C;
  /* tema do projeto (trocado em runtime) */
  --dark:#12120F; --light:#F5F2EA; --accent:#B8873B; --soft:#E4E0D6; --deep:#3F3E35;
  --ink:#1a1a15; --line:rgba(18,18,15,.12);
  --disp:'Fraunces',serif;
  --nav:76px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--light);color:var(--ink);
  font-family:'Public Sans',system-ui,-apple-system,sans-serif;
  font-weight:300;line-height:1.5;overscroll-behavior-y:none;
}
body.inproj{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font-family:inherit;color:var(--ink)}

/* ============ HOME AGÊNCIA ============ */
.home{background:var(--ag-ink);color:var(--ag-bone);min-height:100vh;padding-bottom:60px}
.home-top{padding:calc(env(safe-area-inset-top) + 44px) 0 34px}
.wordmark{display:flex;align-items:baseline;gap:9px}
.wordmark b{
  font-family:'Fraunces',serif;font-weight:400;font-size:25px;
  letter-spacing:.01em;line-height:1;
}
.wordmark i{
  font-style:normal;font-size:8.5px;letter-spacing:.36em;text-transform:uppercase;
  color:var(--ag-amber);
}
.home-top p{
  font-size:13px;color:var(--ag-mute);margin-top:11px;line-height:1.6;max-width:46ch;
}
.sect-h{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:6px 0 15px;
}
.sect-h h2{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--ag-mute);font-weight:500}
.sect-h button{font-size:11px;color:var(--ag-amber);letter-spacing:.06em}

.pcards{display:grid;gap:11px}
.pcard{
  display:block;width:100%;text-align:left;border-radius:5px;overflow:hidden;
  background:rgba(245,242,234,.04);border:1px solid rgba(245,242,234,.1);
  transition:.18s;position:relative;
}
.pcard:hover{background:rgba(245,242,234,.07);border-color:rgba(245,242,234,.2)}
.pcard:active{transform:scale(.99)}
.pcard-band{height:4px;display:flex}
.pcard-band i{flex:1;display:block}
.pcard-in{padding:17px 18px 18px;display:flex;align-items:flex-start;gap:14px}
.pmark{
  flex:0 0 42px;height:42px;border-radius:4px;display:grid;place-items:center;
}
.pmark svg{width:22px;height:22px}
.pmain{flex:1;min-width:0}
.pmain h3{font-family:'Fraunces',serif;font-size:20px;font-weight:400;line-height:1.2;color:var(--ag-bone)}
.pmain small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ag-mute);margin-top:5px}
.pstats{display:flex;gap:16px;margin-top:13px}
.pstats div b{font-family:'Fraunces',serif;font-size:19px;font-weight:400;color:var(--ag-bone);line-height:1;display:block}
.pstats div span{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ag-mute);display:block;margin-top:4px}
.pstats div.alert b{color:var(--ag-amber)}
.chev{flex:0 0 16px;color:var(--ag-mute);padding-top:12px}

.newp{
  width:100%;border:1px dashed rgba(245,242,234,.22);border-radius:5px;
  padding:20px;color:var(--ag-mute);font-size:13px;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:.18s;
}
.newp:hover{border-color:var(--ag-amber);color:var(--ag-amber)}
.home-foot{margin-top:38px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ag-mute);opacity:.55;text-align:center}

/* ============ TOPO PROJETO ============ */
header{
  background:var(--dark);color:var(--light);
  padding:calc(env(safe-area-inset-top) + 12px) 0 0;
  position:sticky;top:0;z-index:40;
}
.hbar{display:flex;align-items:center;gap:12px;padding-bottom:13px}
.back{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;opacity:.6;flex:0 0 30px}
.back:hover{opacity:1;background:rgba(255,255,255,.1)}
.htitle{flex:1;min-width:0}
.htitle h1{font-family:var(--disp);font-weight:400;font-size:17px;letter-spacing:.05em;line-height:1.1}
.htitle small{display:block;font-size:7.5px;letter-spacing:.32em;text-transform:uppercase;opacity:.5;margin-top:4px}
.gear{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;opacity:.55;flex:0 0 30px}
.gear:hover{opacity:1}
.mnav{display:flex;align-items:center;justify-content:center;gap:18px;padding-bottom:14px}
.mnav button{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;opacity:.55}
.mnav button:hover{opacity:1;background:rgba(255,255,255,.1)}
.mnav b{font-family:var(--disp);font-size:22px;font-weight:400;letter-spacing:.05em;min-width:172px;text-align:center}
.mnav b i{font-style:normal;opacity:.45;font-size:17px}
.track{display:flex;gap:2px;height:3px;background:rgba(255,255,255,.14)}
.track span{display:block;transition:width .55s cubic-bezier(.4,0,.2,1)}

/* ============ TABS ============ */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:color-mix(in srgb, var(--light) 94%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:flex;
}
nav.tabs button{flex:1;padding:12px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--deep);opacity:.5;transition:.16s}
nav.tabs button[aria-selected="true"]{opacity:1;color:var(--dark)}
nav.tabs svg{width:20px;height:20px}
nav.tabs span{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:500}

/* ============ CALENDÁRIO ============ */
.cal{padding:20px 0 10px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:7px}
.dow span{text-align:center;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--deep);opacity:.55;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--deep);transition:.16s}
.cell.pad{opacity:0;pointer-events:none}
.cell.has{background:#fff;border:1px solid var(--line);color:var(--ink)}
.cell.has:active{transform:scale(.94)}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--dark)}
.cell b{font-weight:400;font-size:14px;line-height:1}
.cell .dots{display:flex;gap:3px;height:5px;align-items:center}
.cell .dots i{width:5px;height:5px;border-radius:99px;display:block}
.cal-note{font-size:11px;color:var(--deep);opacity:.6;text-align:center;margin-top:16px}

/* ============ LISTA ============ */
.filters{display:flex;gap:6px;overflow-x:auto;padding:16px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);color:var(--deep);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:99px;transition:.16s}
.chip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--light)}
.wk{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--deep);opacity:.5;margin:22px 0 9px}
.card{background:#fff;border:1px solid var(--line);border-radius:3px;display:flex;align-items:flex-start;gap:13px;width:100%;padding:14px 15px;margin-bottom:8px;text-align:left;transition:.16s}
.card:active{transform:scale(.99)}
.card.aprovado{border-left:3px solid var(--deep)}
.card.ajustar{border-left:3px solid var(--accent)}
.card.publicado{border-left:3px solid var(--dark)}
.dt{flex:0 0 40px;text-align:center}
.dt b{display:block;font-family:var(--disp);font-size:23px;font-weight:400;line-height:1;color:var(--dark)}
.dt span{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);opacity:.65;margin-top:3px}
.cmain{flex:1;min-width:0}
.cmain h3{font-family:var(--disp);font-size:18px;font-weight:500;line-height:1.22}
.cmain .meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--deep);opacity:.7;margin-top:5px}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:3.5px 8px;border-radius:99px;font-weight:500}
.pill.aguardando{background:var(--soft);color:var(--deep)}
.pill.aprovado{background:color-mix(in srgb,var(--deep) 16%,transparent);color:var(--deep)}
.pill.ajustar{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pill.publicado{background:var(--dark);color:var(--light)}
.pill.soft{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.pill.softg{background:color-mix(in srgb,var(--deep) 13%,transparent);color:var(--deep)}

/* ============ SHEET ============ */
.scrim{position:fixed;inset:0;background:rgba(10,10,8,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;top:0;z-index:61;background:var(--light);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-width:820px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.sheet-top{
  flex:0 0 auto;background:var(--dark);color:var(--light);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 14px;
  display:flex;align-items:flex-start;gap:12px;
}
.sheet-top .st-main{flex:1;min-width:0}
.sheet-top h2{font-family:var(--disp);font-size:20px;font-weight:500;line-height:1.22}
.sheet-top .meta{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;opacity:.65;margin-top:5px}
.close{
  flex:0 0 40px;width:40px;height:40px;border-radius:99px;
  display:grid;place-items:center;color:var(--light);
  background:rgba(255,255,255,.12);
}
.close:active{background:rgba(255,255,255,.24)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom) + 40px)}
.sheet-foot{
  flex:0 0 auto;border-top:1px solid var(--line);background:var(--light);
  padding:11px 18px calc(env(safe-area-inset-bottom) + 11px);
}
.sheet-foot button{
  width:100%;background:var(--dark);color:var(--light);border-radius:3px;
  padding:14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;
}

.sec{padding-top:19px}
.sec + .sec{margin-top:19px;border-top:1px solid var(--line)}
h4.lbl{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--deep);opacity:.75;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:7px}
h4.lbl svg{width:12px;height:12px}
.sec p{font-size:14.5px;line-height:1.62}
.hook{font-family:var(--disp);font-size:20px;line-height:1.28;color:var(--accent)}
.box{background:#fff;border:1px solid var(--line);border-radius:2px;padding:12px 13px;font-size:14px;line-height:1.65;white-space:pre-wrap}
.tg{font-size:12.5px;color:var(--deep);line-height:1.7;word-break:break-word}
.empty{font-size:13.5px;color:var(--deep);opacity:.55;font-style:italic}
.flag{display:inline-block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);padding:5px 10px;border-radius:2px;margin-top:10px}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.act{flex:1;min-width:130px;border:1px solid var(--dark);color:var(--dark);font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;padding:12px 10px;border-radius:2px;transition:.16s}
.act:hover{background:var(--dark);color:var(--light)}
.act.warn{border-color:var(--accent);color:var(--accent)}
.act.warn:hover{background:var(--accent);color:#fff}
.act.ghost{border-color:var(--line);color:var(--deep);font-weight:400}
.act.ghost:hover{background:var(--deep);color:var(--light);border-color:var(--deep)}
.act:disabled{opacity:.4;cursor:default}
.act.solid{background:var(--dark);color:var(--light)}
.link-btn{font-size:11px;color:var(--deep);opacity:.7;text-decoration:underline}
textarea,input.txt,select.txt{width:100%;border:1px solid var(--line);border-radius:2px;background:#fff;padding:11px 12px;font-size:14px;line-height:1.55;margin-top:9px}
textarea{resize:vertical;min-height:74px}
.note-log{margin-top:11px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-left:2px solid var(--accent);padding:11px 13px;font-size:14px;line-height:1.6}
.note-log b{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:4px}
.stamp{font-size:10.5px;color:var(--deep);opacity:.6;margin-top:10px}
.player{position:relative;width:100%;background:#000;border-radius:3px;overflow:hidden;aspect-ratio:9/16;max-height:420px}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.drop{border:1px dashed color-mix(in srgb,var(--dark) 26%,transparent);border-radius:3px;padding:15px 13px;text-align:center;background:#fff}
.drop p{font-size:13px;color:var(--deep);line-height:1.5}
.mbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:11px;color:var(--deep)}
.mbar a{color:var(--accent);text-decoration:none;font-weight:500}
.ai-out{background:#fff;border:1px solid var(--line);border-left:2px solid var(--deep);border-radius:2px;padding:14px;margin-top:11px}
.ai-out h5{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--deep);font-weight:500;margin-bottom:6px}
.ai-out h5:not(:first-child){margin-top:15px}
.ai-out p,.ai-out li{font-size:14px;line-height:1.65}
.ai-out ol,.ai-out ul{margin:0;padding-left:17px}
.ai-out li{margin-bottom:6px}
.ai-out.check{border-left-color:var(--accent)}
.pending{font-size:13px;color:var(--deep);opacity:.8;margin-top:11px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:99px;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.err{font-size:13px;color:var(--accent);margin-top:9px;line-height:1.5}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:7px;margin-top:9px}
.mgrid label span{display:block;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--deep);opacity:.7;margin-bottom:4px}
.mgrid input{width:100%;border:1px solid var(--line);border-radius:2px;background:#fff;padding:9px 6px;font-size:15px;text-align:center}

/* ============ DASH ============ */
.dash{padding:20px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:3px;padding:15px 14px}
.kpi b{display:block;font-family:var(--disp);font-size:28px;font-weight:400;color:var(--dark);line-height:1}
.kpi span{display:block;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--deep);opacity:.72;margin-top:6px}
.kpi em{font-style:normal;font-size:10.5px;display:block;margin-top:5px}
.kpi em.up{color:var(--deep)} .kpi em.down{color:var(--accent)}
.panel{background:#fff;border:1px solid var(--line);border-radius:3px;padding:17px 16px;margin-top:14px}
.panel h3{font-family:var(--disp);font-size:19px;font-weight:500;color:var(--dark)}
.panel p.lead{font-size:12.5px;color:var(--deep);line-height:1.55;margin-top:4px}
.bars{margin-top:15px;display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}
.bar-row .nm{font-size:12.5px;line-height:1.35;min-width:0}
.bar-row .nm small{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--deep);opacity:.6;margin-top:2px}
.bar-track{grid-column:1/-1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--deep);border-radius:99px;transition:width .5s}
.bar-track i.hi{background:var(--accent)}
.bar-row .vl{font-family:var(--disp);font-size:17px;color:var(--dark)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.split div{background:var(--light);border-radius:2px;padding:11px 12px}
.split b{display:block;font-family:var(--disp);font-size:21px;color:var(--dark);line-height:1}
.split span{display:block;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--deep);opacity:.72;margin-top:5px}

/* ============ CONFIG ============ */
.swatches{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sw{text-align:center}
.sw input[type=color]{width:44px;height:44px;border:1px solid var(--line);border-radius:4px;background:none;padding:2px;cursor:pointer}
.sw span{display:block;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--deep);opacity:.7;margin-top:5px}

.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);width:52px;height:52px;border-radius:99px;background:var(--accent);color:#fff;display:grid;place-items:center;z-index:45;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.fab:active{transform:scale(.92)}
.msg{padding:46px 20px;text-align:center;color:var(--deep);font-size:14px;opacity:.75;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}.pcards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>

<div class="scrim" id="scrim" onclick="fechar()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-top" id="sheetTop"></div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot"><button onclick="fechar()">Fechar e voltar</button></div>
</div>

<script>
/* ==================== CONSTANTES ==================== */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW=['D','S','T','Q','Q','S','S'];
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const FORMATOS=['Reel','Carrossel','Foto','Story'];
const PILARES=['Destination','The House','Experience','Social Proof','Conversion','Design','Behind the Scenes','Educacional','Promocional'];
const FONTES=[['Cormorant Garamond','Serifa clássica'],['Fraunces','Serifa moderna'],['Instrument Serif','Serifa editorial'],['DM Serif Display','Serifa display']];
const STATES={aguardando:{label:'Aguardando'},aprovado:{label:'Aprovado'},ajustar:{label:'Ajustar'},publicado:{label:'Publicado'}};
const CAMPOS=[['alcance','Alcance'],['curtidas','Curtidas'],['salvos','Salvos'],['compart','Compart.'],['coment','Coment.']];
const KEY='cultura-growth-studio-v3';

const VOZ_CASA=`You write for Casa Llamarada, a luxury 4-bedroom private villa in Sayulita, Riviera Nayarit, Mexico (casallamarada.com).
Audience: affluent travelers on the US West Coast and in Canada.

NON-NEGOTIABLE VOICE RULES:
- Sell the FEELING and the experience of being there. Never describe the photo or the space literally.
- Never use em-dashes anywhere.
- If a call to action points to the website, write exactly "link in bio". Never "via the link".
- Warm, understated, confident. Quiet luxury, never salesy or exclamation-heavy.
- Polished professional English. Captions run 2 to 4 short sentences. No emoji in the body.`;

const SUPA_URL = 'https://lalkltemdcpkyehobzxm.supabase.co';

const HEAD = {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};

let sync = {estado:'', quando:'', hash:''};

const store = {
  async get(){
    try{
      const r = await fetch(`${SUPA_URL}/rest/v1/studio?id=eq.${LINHA}&select=data`,{headers:HEAD});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      if(j.length && j[0].data){
        const v = JSON.stringify(j[0].data);
        localStorage.setItem(KEY, v);
        sync.estado='nuvem'; sync.quando=agoraCurto(); sync.hash=v.length+'';
        return v;
      }
      sync.estado='nuvem';
      return localStorage.getItem(KEY);
    }catch(e){
      sync.estado='offline';
      return localStorage.getItem(KEY);
    }
  },
  async set(v){
    localStorage.setItem(KEY, v);
    try{
      const r = await fetch(`${SUPA_URL}/rest/v1/studio`,{
        method:'POST',
        headers:{...HEAD,'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify({id:LINHA, data:JSON.parse(v), updated_at:new Date().toISOString()})
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
      sync.estado='nuvem'; sync.quando=agoraCurto(); sync.hash=v.length+'';
    }catch(e){
      sync.estado='pendente';
    }
    pintaSync();
  }
};

const agoraCurto = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

/* envio de arquivo para o Storage do Supabase */
async function enviarStorage(file, nome){
  const caminho = Date.now()+'-'+nome.replace(/[^\w.\-]/g,'_');
  const r = await fetch(`${SUPA_URL}/storage/v1/object/midia/${caminho}`,{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':file.type||'application/octet-stream'},
    body:file
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return `${SUPA_URL}/storage/v1/object/public/midia/${caminho}`;
}

/* verifica mudanças feitas pela outra pessoa */
async function checarNuvem(){
  if(aberto || editando || config) return;
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/studio?id=eq.${LINHA}&select=data`,{headers:HEAD});
    if(!r.ok) return;
    const j = await r.json();
    if(!j.length || !j[0].data) return;
    const v = JSON.stringify(j[0].data);
    if(v.length+'' !== sync.hash){
      DB = JSON.parse(v);
      localStorage.setItem(KEY, v);
      sync.hash = v.length+''; sync.estado='nuvem'; sync.quando=agoraCurto();
      render();
      toast('Atualizado pela equipe.');
    }
  }catch(e){ sync.estado='offline'; pintaSync(); }
}

const TEMA_AG={dark:'#12120F',light:'#F5F2EA',accent:'#B8873B',soft:'#E4E0D6',deep:'#3F3E35',disp:'Fraunces'};
function aplicaTema(t){
  const r=document.documentElement.style;
  r.setProperty('--dark',t.dark); r.setProperty('--light',t.light);
  r.setProperty('--accent',t.accent); r.setProperty('--soft',t.soft);
  r.setProperty('--deep',t.deep); r.setProperty('--disp',`'${t.disp}',serif`);
  r.setProperty('--line',hexA(t.dark,.13));
  r.setProperty('--ink',mistura(t.dark));
  document.querySelector('meta[name=theme-color]').setAttribute('content',t.dark);
}
function hexA(h,a){ const n=parseInt(h.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function mistura(h){ const n=parseInt(h.slice(1),16); const f=v=>Math.round(v*.85); return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`; }

/* ---------- calendário ---------- */
function viewCal(){
  const [a,m]=mesAtual.split('-').map(Number);
  const first=new Date(a,m-1,1).getDay(), dias=new Date(a,m,0).getDate();
  const hoje=new Date().toISOString().slice(0,10), ps=posts(), t=P().tema;
  const cores={aguardando:t.soft,aprovado:t.deep,ajustar:t.accent,publicado:t.dark};
  let c='';
  for(let i=0;i<first;i++) c+=`<div class="cell pad"></div>`;
  for(let d=1;d<=dias;d++){
    const iso=`${a}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dd=ps.filter(p=>p.date===iso), td=iso===hoje?' today':'';
    if(!dd.length){ c+=`<div class="cell${td}"><b>${d}</b></div>`; continue; }
    c+=`<button class="cell has${td}" onclick="abrir('${dd[0].id}')" aria-label="${d} ${esc(dd[0].concept)}">
      <b>${d}</b><span class="dots">${dd.slice(0,3).map(p=>`<i style="background:${cores[p.status||'aguardando']}"></i>`).join('')}</span></button>`;
  }
  return `<div class="cal"><div class="dow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="grid">${c}</div>
    <p class="cal-note">${ps.length?'Toque em um dia para abrir o post':'Nenhum post neste mês. Toque em + para criar.'}</p></div>`;
}

/* ---------- lista ---------- */
function viewList(cont){
  const ps=posts();
  const opts=[['todos','Todos',ps.length],['aguardando','Aguardando',cont.aguardando],['ajustar','Ajustar',cont.ajustar],['aprovado','Aprovados',cont.aprovado],['publicado','Publicados',cont.publicado]];
  let h=`<div class="filters">${opts.map(([v,l,n])=>`<button class="chip" aria-pressed="${filtro===v}" onclick="filtro='${v}';render()">${l} · ${n}</button>`).join('')}</div>`;
  const vis=ps.filter(p=>filtro==='todos'||(p.status||'aguardando')===filtro);
  if(!vis.length) return h+`<p class="msg">Nada aqui neste filtro.</p>`;
  let wk=null;
  vis.forEach(p=>{
    const d=new Date(p.date+'T12:00:00');
    const w=Math.ceil((d.getDate()+new Date(d.getFullYear(),d.getMonth(),1).getDay())/7);
    if(filtro==='todos'&&w!==wk){ wk=w; h+=`<p class="wk">Semana ${w}</p>`; }
    const st=p.status||'aguardando';
    const temMx=p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null);
    h+=`<button class="card ${st}" onclick="abrir('${p.id}')">
      <span class="dt"><b>${d.getDate()}</b><span>${DIAS[d.getDay()]}</span></span>
      <span class="cmain"><h3>${esc(p.concept)}</h3>
        <span class="meta">${p.fmt} · ${p.pilar}${p.hora?' · '+p.hora:''}</span>
        <span class="tags-row"><span class="pill ${st}">${STATES[st].label}</span>
        ${p.midia?`<span class="pill soft">Vídeo</span>`:''}
        ${(p.ai&&p.ai.legenda)||p.caption?`<span class="pill softg">Legenda</span>`:''}
        ${temMx?`<span class="pill softg">Métricas</span>`:''}</span>
      </span></button>`;
  });
  return h;
}

/* ==================== MÍDIA ==================== */
function embed(u){ u=(u||'').trim(); let m;
  if(u.includes('/storage/v1/object/public/')) return {t:/\.(png|jpe?g|webp|gif|heic)$/i.test(u)?'img':'v', s:u};
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return {t:'i',s:`https://drive.google.com/file/d/${m[1]}/preview`};
  if((m=u.match(/drive\.google\.com\/open\?id=([\w-]+)/))) return {t:'i',s:`https://drive.google.com/file/d/${m[1]}/preview`};
  if((m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]+)/))) return {t:'i',s:`https://www.youtube.com/embed/${m[1]}`};
  if((m=u.match(/vimeo\.com\/(\d+)/))) return {t:'i',s:`https://player.vimeo.com/video/${m[1]}`};
  if(/dropbox\.com\/.+\.(mp4|mov|m4v)/i.test(u)) return {t:'v',s:u.replace(/[?&]dl=0/,'')+(u.includes('?')?'&':'?')+'raw=1'};
  if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u)) return {t:'v',s:u};
  return null; }
function blocoMidia(p){
  if(p.enviando) return `<h4 class="lbl">Vídeo para aprovação</h4>
    <p class="pending"><span class="dot"></span>Enviando arquivo para a nuvem…</p>`;
  if(!p.midia) return `<h4 class="lbl">Vídeo para aprovação</h4>
    <div class="drop">
      <p>Escolha um arquivo do celular, ou cole um link do Drive, YouTube, Vimeo ou Dropbox.</p>
      <div class="btns"><button class="act ghost" onclick="document.getElementById('file-${p.id}').click()">Escolher do celular</button></div>
      <input type="file" id="file-${p.id}" accept="video/*,image/*" style="display:none" onchange="subirArquivo('${p.id}',this)">
      <input class="txt" id="mid-${p.id}" type="url" placeholder="https://drive.google.com/file/d/...">
      <div class="btns"><button class="act ghost" onclick="setMidia('${p.id}')">Usar link</button></div>
      <p style="font-size:11px;opacity:.65;margin-top:9px">Arquivos até 45 MB. A equipe inteira vê o que for enviado.</p>
    </div>`;
  if(p.local){
    const img=(p.midiaTipo||'').startsWith('image');
    return `<h4 class="lbl">Vídeo para aprovação</h4>
      <div class="player">${img
        ?`<img src="${p.midia}" alt="${esc(p.midiaNome||'')}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">`
        :`<video src="${p.midia}" controls playsinline></video>`}</div>
      <div class="mbar"><span style="opacity:.7">${esc(p.midiaNome||'Arquivo do celular')}</span>
      <button class="link-btn" onclick="tiraMidia('${p.id}')">Trocar</button></div>`;
  }
  const e=embed(p.midia);
  return `<h4 class="lbl">Vídeo para aprovação</h4>
    ${e?`<div class="player">${
      e.t==='i'?`<iframe src="${e.s}" allow="autoplay; fullscreen" allowfullscreen title="Prévia"></iframe>`
      :e.t==='img'?`<img src="${e.s}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">`
      :`<video src="${e.s}" controls playsinline preload="metadata"></video>`}</div>`
      :`<div class="drop"><p>Link anexado, sem prévia embutida para este serviço.</p></div>`}
    <div class="mbar"><a href="${esc(p.midia)}" target="_blank" rel="noopener">Abrir em nova aba</a>
    <button class="link-btn" onclick="tiraMidia('${p.id}')">Trocar vídeo</button></div>`;
}
function setMidia(id){ const p=acha(id),i=document.getElementById('mid-'+id),v=i.value.trim(); if(!v){i.focus();return;} p.midia=v; p.local=false; salvar(); pintaSheet(); }
function subirArquivo(id,inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size > 45*1024*1024){
    toast('Arquivo acima de 45 MB. Use o link do Drive.');
    inp.value=''; return;
  }
  const p=acha(id);
  p.enviando=true; pintaSheet();
  enviarStorage(f, f.name).then(url=>{
    p.midia=url; p.local=false; p.midiaNome=f.name; p.midiaTipo=f.type; p.enviando=false;
    p.log=p.log||[];
    p.log.push({quem:quemSou()||'Equipe',quando:agora(),texto:'Anexou o arquivo '+f.name+'.'});
    salvar(); pintaSheet(); toast('Arquivo enviado.');
  }).catch(e=>{
    p.enviando=false; pintaSheet();
    toast('Falha no envio. Verifique a conexão ou use link.');
  });
}

/* ==================== IA ==================== */
async function claude(prompt,mx){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:mx||1200,messages:[{role:"user",content:prompt}]})});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const d=await r.json();
  const t=d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  return JSON.parse(t.replace(/```json|```/g,"").trim());
}
function voz(){ return P().voz || `You write Instagram content for ${P().nome}. Write in polished professional English, warm and confident, never salesy. Captions run 2 to 4 short sentences.`; }

async function gerar(id){
  const p=acha(id); p.aiLoad='g'; p.aiErr=''; pintaSheet();
  try{
    p.ai=await claude(`${voz()}

Produce the full content package for this Instagram post.
Format: ${p.fmt}
Pillar: ${p.pilar}
Concept: ${p.concept}
${p.hook?'Existing hook: '+p.hook:''}
Available material: ${p.material||'not specified'}

Respond with ONLY a JSON object, no preamble, no markdown fences:
{"hook":"on-screen opening text, max 6 words","roteiro":["shot 1 with duration and on-screen text","shot 2","shot 3","shot 4"],"legenda":"the caption","hashtags":"8 to 10 hashtags separated by spaces","cta":"short call to action"}`,1400);
    p.aiQuando=agora(); p.rev=null;
  }catch(e){ p.aiErr='Não consegui gerar agora. Tente de novo em alguns segundos.'; }
  p.aiLoad=''; salvar(); pintaSheet();
}
async function revisar(id){
  const p=acha(id), txt=(p.ai&&p.ai.legenda)||p.caption; if(!txt) return;
  p.aiLoad='r'; p.aiErr=''; pintaSheet();
  try{
    p.rev=await claude(`${voz()}

Review this caption against the voice rules above. Be strict and specific.
CAPTION:
"""${txt}"""

Respond with ONLY a JSON object, no preamble, no markdown fences, notes in Brazilian Portuguese:
{"veredito":"aprovado" or "ajustar","pontos":[{"regra":"which rule","situacao":"ok" or "falha","nota":"one short sentence"}],"sugestao":"corrected caption if ajustar, otherwise empty string"}`,1200);
  }catch(e){ p.aiErr='Não consegui revisar agora. Tente de novo em alguns segundos.'; }
  p.aiLoad=''; salvar(); pintaSheet();
}
function usarSug(id){ const p=acha(id); if(!p.rev?.sugestao) return; p.ai=p.ai||{}; p.ai.legenda=p.rev.sugestao; p.rev=null; salvar(); pintaSheet(); }

function blocoAi(p){
  let h=`<h4 class="lbl">${SPARK} Produção com IA</h4>`;
  if(p.ai) h+=`<div class="ai-out">
    <h5>Hook</h5><p class="hook" style="font-size:19px">${esc(p.ai.hook||'')}</p>

    <h5>Legenda</h5><div class="box">${esc(p.ai.legenda||'')}</div>
    ${p.ai.cta?`<h5>CTA</h5><p>${esc(p.ai.cta)}</p>`:''}
    ${p.ai.hashtags?`<h5>Hashtags</h5><p class="tg">${esc(p.ai.hashtags)}</p>`:''}</div>`;
  if(p.rev){ const ok=p.rev.veredito==='aprovado';
    h+=`<div class="ai-out check"><h5>Revisor de marca · ${ok?'Aprovado':'Precisa de ajuste'}</h5>
      <ul style="list-style:none;padding:0">${(p.rev.pontos||[]).map(pt=>`<li><b>${pt.situacao==='ok'?'✓':'!'}</b> <b style="font-weight:500">${esc(pt.regra)}:</b> ${esc(pt.nota)}</li>`).join('')}</ul>
      ${p.rev.sugestao?`<h5>Versão corrigida</h5><div class="box">${esc(p.rev.sugestao)}</div><div class="btns"><button class="act ghost" onclick="usarSug('${p.id}')">Usar esta versão</button></div>`:''}</div>`; }
  if(p.aiLoad) h+=`<p class="pending"><span class="dot"></span>${p.aiLoad==='g'?'Escrevendo roteiro e legenda…':'Conferindo contra as regras da marca…'}</p>`;
  if(p.aiErr) h+=`<p class="err">${esc(p.aiErr)}</p>`;
  h+=`<div class="btns"><button class="act ghost" onclick="gerar('${p.id}')" ${p.aiLoad?'disabled':''}>${p.ai?'Gerar outra':'Gerar roteiro e legenda'}</button>
    ${(p.ai||p.caption)?`<button class="act ghost" onclick="revisar('${p.id}')" ${p.aiLoad?'disabled':''}>Revisar marca</button>`:''}</div>
    ${p.ai?`<div class="btns"><button class="act ghost" onclick="aplicar('${p.id}')">Aplicar ao post</button></div>`:''}
    ${p.aiQuando?`<p class="stamp">Gerado por IA · ${p.aiQuando}</p>`:''}`;
  return h;
}

/* ==================== AVISO ==================== */
async function avisar(id){
  const p=acha(id);
  const d=new Date(p.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long'});
  const t=`${P().nome} · ${d}\n${p.concept} · ${p.fmt}\n${p.midia?'Vídeo anexado e pronto para revisão.':'Conteúdo atualizado no painel.'}\nAprovação: ${location.href}`;
  try{ await navigator.clipboard.writeText(t); toast('Aviso copiado.'); }catch(e){ prompt('Copie o aviso:',t); }
}
function toast(m){
  const el=document.createElement('div'); el.textContent=m;
  el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 28px);background:var(--dark);color:var(--light);padding:11px 18px;border-radius:99px;font-size:13px;z-index:99';
  document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
}

/* ==================== MÉTRICAS ==================== */
function totais(mk){
  const ps=(P()?.meses?.[mk]?.posts)||[]; const t={alcance:0,curtidas:0,salvos:0,compart:0,coment:0,n:0};
  ps.forEach(p=>{ if(p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null)){ t.n++; CAMPOS.forEach(([k])=>t[k]+=Number(p.mx[k]||0)); } });
  return t;
}
function mesAnterior(){ const [a,m]=mesAtual.split('-').map(Number); const d=new Date(a,m-2,1); return chave(d.getFullYear(),d.getMonth()); }
function delta(x,y){ if(!y) return ''; const p=Math.round((x-y)/y*100); if(!isFinite(p)||!p) return ''; return `<em class="${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}% vs mês anterior</em>`; }

function viewMx(){
  const t=totais(mesAtual), ta=totais(mesAnterior());
  const ps=posts().filter(p=>p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null));
  const A=P().meses[mesAtual]?.analise;
  let h=`<div class="dash"><div class="kpis">
    <div class="kpi"><b>${num(t.alcance)}</b><span>Alcance</span>${delta(t.alcance,ta.alcance)}</div>
    <div class="kpi"><b>${num(t.salvos)}</b><span>Salvos</span>${delta(t.salvos,ta.salvos)}</div>
    <div class="kpi"><b>${num(t.compart)}</b><span>Compartilhamentos</span>${delta(t.compart,ta.compart)}</div>
    <div class="kpi"><b>${t.n}/${posts().length}</b><span>Posts com dados</span></div></div>`;
  if(ps.length){
    const grupo=c=>{ const g={};
      ps.forEach(p=>{ g[p[c]]=g[p[c]]||{al:0,sv:0,n:0}; g[p[c]].al+=Number(p.mx.alcance||0); g[p[c]].sv+=Number(p.mx.salvos||0); g[p[c]].n++; });
      return Object.entries(g).map(([k,v])=>({k,media:Math.round(v.al/v.n),sv:Math.round(v.sv/v.n),n:v.n})).sort((a,b)=>b.media-a.media); };
    h+=`<div class="panel"><h3>Alcance médio por formato</h3><div class="bars">${barras(grupo('fmt'))}</div></div>`;
    h+=`<div class="panel"><h3>Pilares que mais performam</h3><p class="lead">Ordenado por alcance médio.</p><div class="bars">${barras(grupo('pilar'),1)}</div></div>`;
    const can=ps.filter(p=>/canad|geotag/i.test(p.flag||'')), rest=ps.filter(p=>!/canad|geotag/i.test(p.flag||''));
    if(can.length){ const md=a=>a.length?Math.round(a.reduce((s,p)=>s+Number(p.mx.alcance||0),0)/a.length):0;
      h+=`<div class="panel"><h3>Teste de geotag</h3><p class="lead">Alcance médio com e sem marcação.</p>
        <div class="split"><div><b>${num(md(can))}</b><span>Com geotag · ${can.length}</span></div>
        <div><b>${num(md(rest))}</b><span>Sem geotag · ${rest.length}</span></div></div></div>`; }
    h+=`<div class="panel"><h3>Post a post</h3><div class="bars">${barras(ps.map(p=>({k:p.concept,media:Number(p.mx.alcance||0),sv:Number(p.mx.salvos||0),n:1})).sort((a,b)=>b.media-a.media),1)}</div></div>`;
  }
  h+=`<div class="panel"><h3>Leitura estratégica</h3><p class="lead">A IA lê o mês e compara com o anterior.</p>`;
  if(A) h+=`<div class="ai-out"><h5>Resumo</h5><p>${esc(A.resumo||'')}</p>
    <h5>O que funcionou</h5><ul>${(A.funcionou||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h5>Pontos de atenção</h5><ul>${(A.atencao||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    ${A.canada?`<h5>Teste de geotag</h5><p>${esc(A.canada)}</p>`:''}
    <h5>Ações para o próximo mês</h5><ol>${(A.acoes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
  if(analiseLoad) h+=`<p class="pending"><span class="dot"></span>Analisando o desempenho do mês…</p>`;
  if(analiseErr) h+=`<p class="err">${esc(analiseErr)}</p>`;
  h+=`<div class="btns"><button class="act ghost" onclick="lerMes()" ${analiseLoad?'disabled':''}>${A?'Reanalisar':'Ler métricas com IA'}</button></div></div>`;
  h+=`<div class="panel"><h3>Planilha</h3>
    <p class="lead">Exporte para o Sheets, ou cole o CSV para importar. Colunas: data, alcance, curtidas, salvos, compart, coment.</p>
    <div class="btns"><button class="act ghost" onclick="exportCSV()">Exportar CSV</button>
      <button class="act ghost" onclick="document.getElementById('imp').style.display='block'">Importar CSV</button></div>
    <div id="imp" style="display:none"><textarea id="csv" placeholder="2026-08-04,12400,318,96,44,12"></textarea>
      <div class="btns"><button class="act solid" onclick="importCSV()">Importar</button></div></div></div></div>`;
  return h;
}
function barras(arr,sv){
  const max=Math.max(...arr.map(x=>x.media),1);
  return arr.map((x,i)=>`<div class="bar-row">
    <span class="nm">${esc(x.k)}${x.n>1?`<small>${x.n} posts</small>`:''}</span>
    <span class="vl">${num(x.media)}${sv?`<small style="display:block;font-family:'Public Sans';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--deep);opacity:.65;text-align:right">${num(x.sv)} salvos</small>`:''}</span>
    <span class="bar-track"><i class="${i===0?'hi':''}" style="width:${x.media/max*100}%"></i></span></div>`).join('');
}
async function lerMes(){
  const ps=posts().filter(p=>p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null));
  if(!ps.length){ analiseErr='Preencha as métricas de pelo menos um post antes.'; render(); return; }
  analiseLoad=true; analiseErr=''; render();
  const ant=(P().meses[mesAnterior()]?.posts||[]).filter(p=>p.mx&&Object.values(p.mx).some(v=>v!==''&&v!=null)).map(p=>({data:p.date,formato:p.fmt,pilar:p.pilar,...p.mx}));
  try{
    P().meses[mesAtual].analise=await claude(`You are the head of social strategy for ${P().nome}${P().tagline?' ('+P().tagline+')':''}. Brand context:
${voz()}

CURRENT MONTH:
${JSON.stringify(ps.map(p=>({data:p.date,formato:p.fmt,pilar:p.pilar,conceito:p.concept,obs:p.flag||'',...p.mx})),null,1)}

${ant.length?'PREVIOUS MONTH:\n'+JSON.stringify(ant,null,1):'No data for the previous month.'}

Analyse as a strategist, not a reporter. Weight saves and shares over likes, since they signal real intent. Cite the actual numbers behind each point.

Respond with ONLY a JSON object, no preamble, no markdown fences, all text in Brazilian Portuguese:
{"resumo":"two sentences on how the month really went","funcionou":["finding with numbers","another"],"atencao":["problem with numbers","another"],"canada":"what any geotag or audience test suggests, or empty string","acoes":["concrete action","another","another"]}`,1700);
  }catch(e){ analiseErr='Não consegui ler as métricas agora. Tente de novo em alguns segundos.'; }
  analiseLoad=false; salvar(); render();
}
function exportCSV(){
  const L=[['data','conceito','formato','pilar','status',...CAMPOS.map(c=>c[0])].join(',')];
  posts().forEach(p=>L.push([p.date,`"${(p.concept||'').replace(/"/g,'""')}"`,p.fmt,p.pilar,p.status||'aguardando',...CAMPOS.map(([k])=>p.mx?.[k]??'')].join(',')));
  const b=new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=`${projAtual}-${mesAtual}.csv`; a.click(); URL.revokeObjectURL(a.href);
}
function importCSV(){
  const t=document.getElementById('csv').value.trim(); if(!t) return; let ok=0;
  t.split(/\r?\n/).forEach(l=>{
    const c=l.split(',').map(x=>x.trim()), d=c[0];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    const alvo=(P().meses[d.slice(0,7)]?.posts||[]).find(p=>p.date===d); if(!alvo) return;
    alvo.mx=alvo.mx||{};
    CAMPOS.forEach(([k],i)=>{ const v=c[i+1]; if(v!==undefined&&v!=='') alvo.mx[k]=parseInt(v,10)||0; });
    ok++;
  });
  salvar(); render(); toast(ok?`${ok} post${ok>1?'s':''} atualizado${ok>1?'s':''}.`:'Nenhuma data bateu.');
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&aberto) fechar(); });
aplicaTema(TEMA_AG);
carregar();
